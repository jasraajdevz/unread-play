var PHOTO_REVEAL_MS = 600;
var INTER_BEAT_MS   = 6000;
var PHOTO_ARRIVE_MS = 5000;
var THREADS_TO_READ = 3;
var UNKNOWN = "t_unknown";
var APP_NAME = "Loop";   /* the fictional messenger. Guideline 4.1: not anyone else's. */

var params = new URLSearchParams(window.location.search);
var FAST = params.has("fast");
var CONTENT = window.CONTENT || {};
var LADDER = CONTENT.ladder || { days: [], phaseWindowMs: 600000, fastWindowMs: 30000 };
var PHASE_WINDOW_MS = FAST ? (LADDER.fastWindowMs || 30000) : (LADDER.phaseWindowMs || 600000);

var S = {
  beat: 1,
  opened: {},
  flags: {},
  hidden: {},
  current: null,
  ended: false,
  leftDuringLive: false,
  shown: {},
  save: null,
  away: null,
  repliesLocked: false,
  pendingChoices: [],
  liveChoices: [],
  lastDeflect: {}
};

var scroll  = document.getElementById("scroll"),
    appbar  = document.getElementById("appbar"),
    choicesEl = document.getElementById("choices"),
    endEl   = document.getElementById("end");

document.getElementById("clock").textContent = hhmm(LAUNCH);

function resetThreads(){
  S.shown = {};
  Story.threads().forEach(function(t){
    S.shown[t.id] = Story.messagesOf(t.startBeat, S.flags).slice();
  });
}
resetThreads();

function shownOf(t){ return S.shown[t.id] || []; }
function lastOffset(t){
  var m = shownOf(t);
  return m.length ? m[m.length-1].offsetMinutes : -999999;
}
function isUnread(t){ return (t.startsUnread || t.forcedUnread) && !S.opened[t.id]; }

/* How many, not whether. A phone that says "some" is a phone nobody built. */
function seenBank(){
  if(!S.save) return {};
  return S.save.seen || (S.save.seen = {});
}
/* A thread you have never opened is not 31 unread. You put the phone down after the
   last thing you sent, so that is where the count starts. */
function defaultSeen(msgs){
  for(var i = msgs.length - 1; i >= 0; i--){ if(msgs[i].from === "me") return i + 1; }
  return 0;
}
function unreadCount(t){
  var msgs = shownOf(t), stored = seenBank()[t.id];
  var seen = stored === undefined ? defaultSeen(msgs) : stored, n = 0;
  for(var i = seen; i < msgs.length; i++){ if(msgs[i].from !== "me") n++; }
  return n;
}
function markSeen(t){
  seenBank()[t.id] = shownOf(t).length;
  if(S.save) Save.write(S.save);
}
function sortedThreads(){
  return Story.threads()
    .filter(function(t){ return !S.hidden[t.id]; })
    .slice()
    .sort(function(a,b){ return lastOffset(b)-lastOffset(a); });
}

/* ============================================================================
   THE HALLWAY, DRAWN NOT FETCHED
   ========================================================================== */
function hallway(scale, detail, variant){
  scale = scale || 1;
  var W=260*scale,H=190*scale,c=document.createElement("canvas");
  c.width=W; c.height=H;
  var g=c.getContext("2d");
  g.fillStyle="#0a0a0b"; g.fillRect(0,0,W,H);
  var vx=W*0.54, vy=H*0.48;
  var s2=scale;
  g.fillStyle="#111214";
  g.beginPath(); g.moveTo(0,0); g.lineTo(vx-46*s2,vy-30*s2); g.lineTo(vx-46*s2,vy+34*s2); g.lineTo(0,H); g.fill();
  g.fillStyle="#0e0f11";
  g.beginPath(); g.moveTo(W,0); g.lineTo(vx+52*s2,vy-30*s2); g.lineTo(vx+52*s2,vy+34*s2); g.lineTo(W,H); g.fill();
  g.fillStyle="#141517";
  g.beginPath(); g.moveTo(0,H); g.lineTo(vx-46*s2,vy+34*s2); g.lineTo(vx+52*s2,vy+34*s2); g.lineTo(W,H); g.fill();
  var grd=g.createLinearGradient(vx-46*s2,vy-30*s2,vx+52*s2,vy+34*s2);
  grd.addColorStop(0,"#2b2721"); grd.addColorStop(.55,"#4a4034"); grd.addColorStop(1,"#211e1a");
  g.fillStyle=grd; g.fillRect(vx-46*s2,vy-30*s2,98*s2,64*s2);
  var sp=g.createLinearGradient(vx,vy+34*s2,vx,H);
  sp.addColorStop(0,"rgba(120,102,74,0.22)"); sp.addColorStop(1,"rgba(120,102,74,0)");
  g.fillStyle=sp;
  g.beginPath(); g.moveTo(vx-46*s2,vy+34*s2); g.lineTo(vx+52*s2,vy+34*s2); g.lineTo(W*0.86,H); g.lineTo(W*0.16,H); g.fill();
  if(detail){
    /* Barely there on purpose: a standing shape against the spill, a couple of
       percent of contrast. If it is obvious it is a jump scare, and if it is
       invisible it is not a reward. */
    var fx=vx+7*s2, fy=vy+34*s2, fw=12*s2, fh=46*s2;
    var body=g.createLinearGradient(fx,fy-fh,fx,fy);
    body.addColorStop(0,"rgba(13,12,11,0.38)");
    body.addColorStop(1,"rgba(17,15,13,0.16)");
    g.fillStyle=body;
    g.beginPath();
    g.ellipse(fx,fy-fh+7*s2,fw*0.34,fw*0.40,0,0,Math.PI*2); g.fill();
    g.fillRect(fx-fw*0.5,fy-fh+12*s2,fw,fh-12*s2);
  }

  if(variant === 1){
    /* the difference: something left on the floor, in the spill, near the left wall */
    g.fillStyle="rgba(9,8,8,0.72)";
    g.beginPath();
    g.ellipse(W*0.34,H*0.86,10*s2,4.5*s2,-0.18,0,Math.PI*2); g.fill();
    g.fillStyle="rgba(14,12,11,0.55)";
    g.fillRect(W*0.34-8*s2,H*0.86-6*s2,15*s2,6*s2);
  }

  var vg=g.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.95);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.82)");
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  var img=g.getImageData(0,0,W,H), d=img.data;
  for(var i=0;i<d.length;i+=4){
    var n=(Math.random()-0.5)*34;
    d[i]  =Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n*0.9));
  }
  g.putImageData(img,0,0);
  return c;
}

/* ============================================================================
   RENDER LAYER
   ========================================================================== */
function previewToken(t){
  if(isLocked(t)) return Text.mint("ui.chrome", "····");
  var m = shownOf(t);
  if(!m.length) return Text.mint("story.preview", "");
  var last = m[m.length-1];
  if(last.kind === "photo") return Text.mint("ui.chrome", "Photo");
  /* Only a group chat names its speaker. In a one-to-one thread the name is already
     the thread title, and "Mom: ren" reads like a bug. */
  var group = (t.participantIds || []).length > 1;
  var who = (group && last.fromContactId) ? Story.contact(last.fromContactId) : null;
  var prefix = who ? who.displayName + ": " : "";
  return Text.mint("story.preview", prefix + (last.body || ""));
}

/* force is for the three places that mean it: the back button, closing search, and
   boot. Everything else is a timer, and a timer does not get to close what you opened. */
function renderList(force){
  if(S.current && !force) return;
  S.current=null; choicesEl.innerHTML="";
  appbar.innerHTML='<span class="title"></span>'
    + '<button class="find" id="find" aria-label="Search">' + FIND_GLYPH + '</button>'
    + '<button class="cog" id="cog" aria-label="Settings">⚙</button>';
  Text.paint(appbar.querySelector(".title"), Text.mint("ui.chrome", APP_NAME));
  appbar.querySelector("#find").addEventListener("click", openSearch);
  appbar.querySelector("#cog").addEventListener("click", openSettings);
  scroll.innerHTML="";
  sortedThreads().forEach(function(t){
    var b=document.createElement("button");
    b.className="row";
    b.setAttribute("data-thread", t.id);
    b.innerHTML='<span class="avatar"></span><span class="rb"><span class="rt">'+
      '<span class="rn"></span><span class="rtime"></span></span><span class="rp"></span></span>';
    var av=b.querySelector(".avatar");
    av.style.background = t.accentHex || "#6E7480";
    av.textContent = (t.displayName || "").charAt(0).toUpperCase();
    Text.paint(b.querySelector(".rn"), Story.threadName(t));
    b.querySelector(".rtime").textContent = listStamp(lastOffset(t));
    Text.paint(b.querySelector(".rp"), previewToken(t));
    if(isLocked(t)){
      var l=document.createElement("span"); l.className="lock";
      l.textContent="🔒";        /* not-story: a glyph */
      b.appendChild(l);
    }
    if(isUnread(t)){
      var d=document.createElement("span"); d.className="dot";
      var n = unreadCount(t);
      d.textContent = String(n > 99 ? 99 : (n || 1));   /* not-story: a count */
      b.appendChild(d);
      b.classList.add("new");
      if(prefs.alerts) b.classList.add("pulse");
    }
    b.addEventListener("click", function(){ openThread(t); });
    scroll.appendChild(b);
  });
  scroll.scrollTop=0;
  drawStatusBar();
  maybeAdvance();
}

function bubbleFor(m, prev){
  if(m.kind === "game"){
    if(m.game === "spot")   return spotWidget(m);
    if(m.game === "recall") return recallWidget(m);
    if(m.game === "match")  return matchWidget(m);
    return gameWidget(m);
  }
  if(m.kind === "audio"){ return memoWidget(m); }
  if(m.kind === "photo"){
    var p=document.createElement("div"); p.className="photo";
    p.setAttribute("data-src","story.photo");
    p.setAttribute("tabindex","0");
    p.appendChild(hallway(1, 0));
    p.addEventListener("click", function(){ viewer.open(); });
    p.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); viewer.open(); }
    });
    return p;
  }
  var prevWho = prev && prev.fromContactId, thisWho = m.fromContactId;
  var same = prev && prev.from === m.from && prevWho === thisWho;
  var el=document.createElement("div");
  el.className = "msg " + (m.from === "me" ? "me" : "them") + (same ? " run" : "");
  var thread = m.__threadId ? Story.thread(m.__threadId) : S.current;
  var isGroup = !!(thread && (thread.participantIds || []).length > 1);
  var whoToken = (isGroup && m.fromContactId) ? Story.contactName(m.fromContactId) : null;
  if(whoToken && !same){
    var w=document.createElement("span"); w.className="who";
    Text.paint(w, whoToken);
    el.appendChild(w);
  }
  var body=document.createElement("span");
  body.className="body";
  Text.paint(body, m.__token || Story.bodyOf(m));
  el.appendChild(body);
  el.setAttribute("data-src", body.getAttribute("data-src"));
  paintReaction(el, m);
  wireReactable(el, m);
  return el;
}

function appendStamp(wrap, m){
  if(!m.showTimestamp) return;
  var s=document.createElement("div"); s.className="stamp";
  s.textContent = stampLabel(m.offsetMinutes);
  wrap.appendChild(s);
}

function paint(t){
  if(S.current && S.current.id === t.id) markSeen(t);
  var wrap=document.createElement("div"); wrap.className="convo";
  var lastDay=null, prev=null;
  shownOf(t).forEach(function(m){
    var d=at(m.offsetMinutes);
    /* D5: a divider needs a calendar-day change AND a gap of at least 30 minutes. */
    var gapOK = !prev || (m.offsetMinutes - prev.offsetMinutes) >= 30;
    if(dayKey(d)!==lastDay && (lastDay===null || gapOK)){
      var div=document.createElement("div"); div.className="divider";
      div.textContent=dayLabel(d); wrap.appendChild(div);
      lastDay=dayKey(d); prev=null;
    }
    var bubble = bubbleFor(m, prev);
    var when = document.createElement("span");
    when.className = "when";
    when.textContent = hhmm(at(m.offsetMinutes));    /* not-story: a clock time */
    when.setAttribute("aria-hidden", "true");
    bubble.appendChild(when);
    wrap.appendChild(bubble);
    appendStamp(wrap, m);
    prev=m;
  });
  scroll.innerHTML=""; scroll.appendChild(wrap);
  wireSwipe(wrap);
  return wrap;
}

function openThread(t){
  S.current=t; S.opened[t.id]=true; t.forcedUnread=false;
  markSeen(t);
  choicesEl.innerHTML="";
  appbar.innerHTML='<button class="back" aria-label="Back">‹</button><span class="title"></span>';
  Text.paint(appbar.querySelector(".title"), Story.threadName(t));
  appbar.querySelector(".back").addEventListener("click", function(){
    if(!S.ended) renderList(true);
  });
  if(isLocked(t)) paintLocked(t); else paint(t);
  scroll.scrollTop=0;
  /* One call, because renderChoices owns the panel -- including the composer. Appending
     it here as well was how a thread ended up with two fields you could type into. */
  if(isLocked(t) || S.ended) choicesEl.innerHTML = "";
  else renderChoices(choicesForThread(t.id));
  if(t.id === UNKNOWN){
    if((S.save.day || 1) >= FINAL_DAY) revealFinalEnding();
    runQueue();
  }
  else maybeAdvance();
}

/* ============================================================================
   LIVE DELIVERY
   ========================================================================== */
function deliver(threadId, list, done){
  var t = Story.thread(threadId);
  var wrap = scroll.querySelector(".convo");
  if(!wrap){ if(done) done(); return; }
  var i=0;
  (function step(){
    if(i>=list.length){ if(done) done(); return; }
    var m=list[i++];
    setTimeout(function(){
      var showTyping = m.kind !== "photo" && m.from !== "me";
      var ty=null;
      if(showTyping){
        ty=document.createElement("div"); ty.className="typing";
        ty.innerHTML="<i></i><i></i><i></i>";
        wrap.appendChild(ty); scroll.scrollTop=scroll.scrollHeight;
      }
      setTimeout(function(){
        if(ty) ty.remove();
        var prev = shownOf(t)[shownOf(t).length-1];
        S.shown[t.id].push(m);
        var el=bubbleFor(m, prev); el.classList.add("live");
        announce(m);
        wrap.appendChild(el);
        appendStamp(wrap, m);
        scroll.scrollTop=scroll.scrollHeight;
        step();
      }, showTyping ? (m.typingMs || 0) : PHOTO_REVEAL_MS);
    }, m.delayMs || 0);
  })();
}

/* ============================================================================
   BEATS (day 1 night)
   ========================================================================== */
function maybeAdvance(){
  var read=Object.keys(S.opened).length;
  if(S.beat===1 && read>=THREADS_TO_READ && !S.current){
    S.beat=2;
    setTimeout(function(){
      var t=Story.thread(UNKNOWN);
      var photo=Story.messagesOf("b_unknown_2", S.flags);
      S.shown[UNKNOWN]=S.shown[UNKNOWN].concat(photo);
      t.forcedUnread=true; S.opened[UNKNOWN]=false;
      if(!S.current) renderList();
    }, PHOTO_ARRIVE_MS);
  }
}

function runQueue(){
  if(S.beat===2){
    S.beat=3;
    deliver(UNKNOWN, Story.messagesOf("b_unknown_3", S.flags), function(){
      S.beat=4;
      setTimeout(beat4, INTER_BEAT_MS);
    });
  } else if(S.beat===4){
    beat4();
  }
}

function beat4(){
  var t=Story.thread(UNKNOWN);
  if(S.current !== t){ t.forcedUnread=true; S.opened[UNKNOWN]=false; renderList(); return; }
  if(S.leftDuringLive) S.flags["left_during_live"]=true;
  deliver(UNKNOWN, Story.messagesOf("b_unknown_4", S.flags), function(){
    S.beat=5;
    renderChoices(Story.choicesOf("b_unknown_4").map(function(c){
      return { id: c.id, label: c.label, match: c.match, silent: c.silent,
               token: Story.labelOf(c), choice: c };
    }));
  });
}


/* A reply belongs to the question it answers, not merely to the thread. If Mom asked
   about the weekend and then about the car, answering one must not discard the other --
   but four buttons at once is a wall, so a conversation offers one question's answers at
   a time, in the order they were asked. Answer the weekend and the car is still there. */
function pendingInThread(threadId){
  return S.pendingChoices.filter(function(c){ return c.threadId === threadId; });
}

function choicesForThread(threadId){
  var all = pendingInThread(threadId);
  if(!all.length) return [];
  var oldest = all[0].templateId;
  return all.filter(function(c){ return c.templateId === oldest; });
}

/* The player's reply lands in the thread as a message. Without this the choice vanishes
   and the conversation does not change, which reads as a broken button. */
function answerInThread(item){
  var t = Story.thread(item.threadId);
  if(t && S.shown[t.id]){
    S.shown[t.id].push({
      id: "reply_" + item.id + "_" + S.shown[t.id].length,
      from: "me",
      kind: "text",
      body: item.label,
      offsetMinutes: 0,
      live: false,
      delayMs: 0,
      typingMs: 0,
      __threadId: item.threadId,
      __token: item.token
    });
    announce({ from: "me" });
  }
  /* only this question's replies are spent; anything else the thread asked survives */
  S.pendingChoices = S.pendingChoices.filter(function(c){
    return !(c.threadId === item.threadId && c.templateId === item.templateId);
  });
  if(item.onPick) item.onPick(item);

  if(S.current && t && S.current.id === t.id){
    paint(t);
    scroll.scrollTop = scroll.scrollHeight;
    renderChoices(choicesForThread(t.id));
  }
}


/* The bar you type into. Built fresh per thread so it never carries a draft across. */
function buildComposer(t){
  var wrap = document.createElement("form");
  wrap.className = "composer";
  wrap.setAttribute("data-thread", t.id);

  var input = document.createElement("input");
  input.type = "text";
  input.id = "say";
  input.className = "say";
  input.setAttribute("autocomplete", "off");
  input.setAttribute("maxlength", String(MAX_TYPED));
  input.setAttribute("enterkeyhint", "send");

  var send = document.createElement("button");
  send.type = "submit";
  send.className = "send";
  send.id = "send";
  send.textContent = SEND_GLYPH;                 /* not-story: a glyph */
  send.setAttribute("aria-label", "Send");       /* not-story: chrome */

  /* Nobody in this thread is left to answer: Notify never did, and by the end of Act I
     the budget is gone. The field stays -- being able to type into a room that has
     stopped answering is the whole of act one. */
  var mute = S.repliesLocked || !castOf(t.id).some(function(c){
    return (c.unmatched || []).length > 0;
  });
  input.setAttribute("placeholder", mute ? COMPOSE_MUTE : COMPOSE_HINT);
  input.setAttribute("aria-label", COMPOSE_HINT);

  function submit(e){
    if(e) e.preventDefault();
    var text = input.value;
    if(!String(text).trim()) return;
    input.value = "";
    sendTyped(text);
    input.focus();
  }
  wrap.addEventListener("submit", submit);

  wrap.appendChild(input);
  wrap.appendChild(send);
  return wrap;
}

/* ============================================================================
   TYPING
   The player types anything. Director.matchReply decides which authored reply they
   meant; the characters' words are still the ones somebody wrote down. What the
   player typed is what appears in their bubble -- not the label of whatever it
   matched, because a message that comes back reworded is a message you did not send.
   ========================================================================== */
var MAX_TYPED = 240;

/* Only t_flat declares participantIds, and c_unknown is not in story.json at all, so who
   is in a thread comes from the cast -- each member names the thread they live in. */
function castOf(threadId){
  var cast = (CONTENT.cast && CONTENT.cast.cast) || [];
  return cast.filter(function(c){ return c.thread === threadId; });
}

function unmatchedLineFor(threadId){
  var speakers = castOf(threadId).filter(function(c){
    return (c.unmatched || []).length > 0;
  });
  if(!speakers.length) return null;
  var r = seededRand(threadId + "|unmatched|" + ((S.save && S.save.day) || 1) + "|" + typedCount());
  var who = speakers[Math.floor(r() * speakers.length) % speakers.length];
  var lines = who.unmatched;
  var i = Math.floor(r() * lines.length) % lines.length;
  /* the same line twice running reads as a broken bot rather than a person */
  if(lines.length > 1 && lines[i] === S.lastDeflect[threadId]) i = (i + 1) % lines.length;
  S.lastDeflect[threadId] = lines[i];
  return { contactId: who.id, body: lines[i] };
}

function typedBank(){
  if(!S.save) return [];
  var state = S.save.contactState || (S.save.contactState = {});
  return state.typed || (state.typed = []);
}
function typedCount(){ return typedBank().length; }

/* Verbatim, with the day it was said on. Act III is going to read this back. */
function recordTyped(threadId, text){
  typedBank().push({
    day: (S.save && S.save.day) || 1,
    phase: (S.save && S.save.phase) || "day",
    threadId: threadId,
    text: text
  });
  Save.write(S.save);
}

function pushMine(threadId, text){
  var t = Story.thread(threadId);
  if(!t || !S.shown[t.id]) return;
  S.shown[t.id].push({
    id: "typed_" + t.id + "_" + S.shown[t.id].length,
    from: "me",
    kind: "text",
    body: text,
    offsetMinutes: 0,
    live: false,
    delayMs: 0,
    typingMs: 0,
    __threadId: t.id,
    __token: Player.said(text)
  });
  announce({ from: "me" });
}

function sendTyped(text){
  var t = S.current;
  if(!t) return;
  text = String(text || "").trim().slice(0, MAX_TYPED);
  if(!text) return;

  var mine = (S.liveChoices || []).filter(function(c){ return !c.silent; });
  var hit = window.Director ? Director.matchReply(text, mine.map(function(c){
    return { id: c.id, label: c.label, match: c.match, silent: c.silent };
  })) : null;

  pushMine(t.id, text);
  recordTyped(t.id, text);

  if(hit){
    var item = null;
    mine.forEach(function(c){ if(c.id === hit.choice.id) item = c; });
    if(item){ answerTyped(item); return; }
  }
  deflect(t.id);
}

/* A matched reply spends the question and records everything the tapped one would have,
   but the bubble is already on screen and it is theirs. */
function answerTyped(item){
  S.pendingChoices = S.pendingChoices.filter(function(c){
    return !(c.threadId === item.threadId && c.templateId === item.templateId);
  });
  if(item.choice){
    choicesEl.innerHTML = "";
    S.pendingChoices = [];
    finish(item.choice);
    return;
  }
  if(item.onPick) item.onPick(item);
  var t = Story.thread(item.threadId);
  if(S.current && t && S.current.id === t.id){
    paint(t);
    scroll.scrollTop = scroll.scrollHeight;
    renderChoices(choicesForThread(t.id));
  }
}

/* Nobody wrote a reply to that. The thread does not pretend otherwise -- it answers in
   the voice of whoever is in it, and the number answers differently, because the number
   never fails to understand you. */
function deflect(threadId){
  var line = unmatchedLineFor(threadId);
  var t = Story.thread(threadId);
  if(!line || !t || !S.shown[t.id]){ paint(t); return; }
  window.setTimeout(function(){
    S.shown[t.id].push({
      id: "deflect_" + t.id + "_" + S.shown[t.id].length,
      from: "them",
      fromContactId: line.contactId,
      kind: "text",
      body: line.body,
      offsetMinutes: 0,
      live: true,
      __threadId: t.id,
      __token: Generated.unmatched(line.body)
    });
    if(S.current && S.current.id === t.id){
      paint(t);
      scroll.scrollTop = scroll.scrollHeight;
    }
    announce({ from: "them" });
  }, 900);
  paint(t);
  scroll.scrollTop = scroll.scrollHeight;
}

/* One place choices are built, for the same reason as one place text is painted. */
function renderChoices(items){
  choicesEl.innerHTML="";
  S.liveChoices = items || [];
  var restore = S.current && !isLocked(S.current) && !S.ended;
  if(S.repliesLocked){
    if(restore) choicesEl.appendChild(buildComposer(S.current));
    return;
  }
  items.forEach(function(item){
    var b=document.createElement("button");
    b.className="choice";
    b.setAttribute("data-choice", item.id);
    Text.paint(b, item.token);
    b.addEventListener("click", function(){
      if(item.choice){
        choicesEl.innerHTML="";
        S.pendingChoices=[];
        finish(item.choice);
      } else {
        answerInThread(item);
      }
    });
    choicesEl.appendChild(b);
  });
  if(restore) choicesEl.appendChild(buildComposer(S.current));
}

/* ============================================================================
   D20 — ENDINGS DECLARE A MECHANIC
   ========================================================================== */
var MECHANIC_TIMING = {
  linear:   { reveal: 3600 },
  hold:     { typingAfter: 4000, reveal: 26000 },
  reappear: { removeAfter: 700, returnAfter: 7000, reveal: 12500 }
};

var FINAL_DAY = 100;

/* Day 1's answer used to end the run, which made days 2-100 unreachable in play. It now
   sets the flag and the game carries on: the ending it chose arrives on day 100, ninety
   nine days later. */
function finish(choice){
  (choice.setsFlags || []).forEach(function(f){ S.flags[f]=true; });
  S.save.flags = S.flags;
  Save.write(S.save);
  if((S.save.day || 1) < FINAL_DAY) return;
  S.ended=true;
  var ending=Story.endingFor(S.flags);
  if(!ending) return;
  var mechanic = ending.mechanic || "linear";
  var timing = MECHANIC_TIMING[mechanic] || MECHANIC_TIMING.linear;
  var messages=Story.messagesOf(ending.beatId, S.flags);

  if(mechanic === "reappear"){
    setTimeout(function(){ S.hidden[UNKNOWN]=true; renderList(); }, timing.removeAfter);
    setTimeout(function(){
      S.hidden[UNKNOWN]=false;
      S.shown[UNKNOWN]=messages.slice();
      Story.thread(UNKNOWN).forcedUnread=true; S.opened[UNKNOWN]=false;
      renderList();
    }, timing.returnAfter);
    setTimeout(function(){ reveal(ending); }, timing.reveal);
    return;
  }

  if(mechanic === "hold"){
    var wrap=scroll.querySelector(".convo");
    setTimeout(function(){
      if(!wrap) return;
      var ty=document.createElement("div"); ty.className="typing";
      ty.innerHTML="<i></i><i></i><i></i>";
      wrap.appendChild(ty); scroll.scrollTop=scroll.scrollHeight;
    }, timing.typingAfter);
    setTimeout(function(){ reveal(ending); }, timing.reveal);
    return;
  }

  var immediate=messages.filter(function(m){ return m.from==="me"; });
  var rest=messages.filter(function(m){ return m.from!=="me"; });
  var wrap2=scroll.querySelector(".convo");
  immediate.forEach(function(m){
    var prev=shownOf(Story.thread(UNKNOWN)).slice(-1)[0];
    S.shown[UNKNOWN].push(m);
    if(wrap2){ wrap2.appendChild(bubbleFor(m, prev)); appendStamp(wrap2, m); }
  });
  if(wrap2) scroll.scrollTop=scroll.scrollHeight;
  deliver(UNKNOWN, rest, function(){
    setTimeout(function(){ reveal(ending); }, timing.reveal);
  });
}

function reveal(ending){
  Text.paint(document.getElementById("endTitle"), Story.endingTitle(ending));
  Text.paint(document.getElementById("endBody"), Story.endingBody(ending));
  endEl.classList.add("on");
}

document.getElementById("again").addEventListener("click", function(){
  Save.clear(); window.location.reload();
});

/* ============================================================================
   THE DAY RUNNER — generated days 2..N
   ========================================================================== */
function planFor(day){
  if(!window.Director || !CONTENT.templates) return null;
  var carried = {
    flags: S.flags,
    fired: (S.save && S.save.fired) || {},
    memory: (S.save && S.save.contactState && S.save.contactState.memory) || {},
    clues: (S.save && S.save.cluesFound) || {},
    /* D45: what the player actually typed. The director is still pure -- this is data
       handed in, the same way memory is, so the same seed and the same history still
       produce the same run. */
    typed: (S.save && S.save.contactState && S.save.contactState.typed) || []
  };
  return window.Director.planDay(
    { cast: CONTENT.cast, templates: CONTENT.templates, ladder: CONTENT.ladder,
      story: Story.raw },
    (S.save && S.save.runSeed) || "default", day, carried);
}

/* Turn generated events into messages the renderer already understands. Offsets are
   spread across the phase window so the thread list stamps them plausibly. */
function eventsToMessages(events, baseOffsetMin){
  var out = [], n = 0;
  events.forEach(function(e){
    if(e.kind === "choice") return;
    out.push({
      id: "g_" + (baseOffsetMin) + "_" + (n),
      from: "them",
      kind: e.kind || "text",
      game: e.game || null,
      asset: e.asset || null,
      durationMs: e.durationMs || null,
      fromContactId: e.speaker,
      __threadId: e.threadId,
      emphasis: e.emphasis || null,
      body: e.body,
      offsetMinutes: baseOffsetMin + n,
      live: false,
      delayMs: 0,
      typingMs: 0,
      __token: Text.mint(e.quotesPlayer ? "director.quote" : "director.message", e.body)
    });
    n += 1;
  });
  return out;
}

function loadPhase(day, phase, options){
  options = options || {};
  var plan = planFor(day);
  if(!plan) return null;
  S.save.day = day; S.save.phase = phase;
  var events = plan.phases[phase] || [];

  if(!plan.authored){
    resetThreads();
    var byThread = {};
    events.forEach(function(e){
      if(e.kind === "choice") return;
      (byThread[e.threadId] = byThread[e.threadId] || []).push(e);
    });
    Object.keys(byThread).forEach(function(threadId){
      if(!S.shown[threadId]) return;
      var base = -(60 - Math.min(50, byThread[threadId].length));
      S.shown[threadId] = S.shown[threadId].concat(
        eventsToMessages(byThread[threadId], base));
      var t = Story.thread(threadId);
      if(t) { t.forcedUnread = true; S.opened[threadId] = false; }
    });
    S.pendingChoices = events
      .filter(function(e){ return e.kind === "choice"; })
      .map(function(e){
        return { id: e.choiceId, threadId: e.threadId, templateId: e.templateId,
                 label: e.label, match: e.match, silent: e.silent,
                 token: Generated.label(e), tells: e.tells,
                 revealsClue: e.revealsClue, memory: e.memory,
                 onPick: function(item){
                   recordTold(item.tells);
                   recordClue(item.revealsClue);
                   recordMemory(item.memory);
                 } };
      });
  }
  Save.write(S.save);
  if(!options.silent) renderList();
  /* the ending belongs to the thread it is about; it must not slam over Mom */
  if(day >= FINAL_DAY && phase === "night" &&
     (!S.current || S.current.id === UNKNOWN)) revealFinalEnding();
  return plan;
}

/* One hundred days later. Whatever was said on night one is what it says back. */
function revealFinalEnding(){
  if(S.ended) return;
  var ending = Story.endingFor(S.flags) || Story.endingFor({ unanswered: true });
  if(!ending) return;
  S.ended = true;
  reveal(ending);
}

/* Act I only writes lastToldByRen. Act II reads it. Retrofitting memory onto twenty days
   of already-played history is not possible, so it is written from day one. */
function recordTold(tells){
  if(!tells) return;
  var state = S.save.contactState || (S.save.contactState = {});
  var told = state.lastToldByRen || (state.lastToldByRen = []);
  told.push({ day: S.save.day, phase: S.save.phase, said: tells });
  Save.write(S.save);
}

/* D27: a reply that reveals something writes the clue id. Act I only accumulates; nothing
   reads these until Act II. */
function recordClue(clueId){
  if(!clueId) return;
  var found = S.save.cluesFound || (S.save.cluesFound = {});
  found[clueId] = { day: S.save.day, phase: S.save.phase };
  Save.write(S.save);
}

/* Act II quotes this back. Written the first time only: the earliest thing the player
   said is the one that has had longest to be wrong. */
function recordMemory(memory){
  if(!memory || !memory.tag) return;
  var state = S.save.contactState || (S.save.contactState = {});
  var bank = state.memory || (state.memory = {});
  if(bank[memory.tag]) return;
  bank[memory.tag] = memory.fragment;
  Save.write(S.save);
}







/* ============================================================================
   SEARCH — a hundred days of messages and no way to find one.
   Locked threads are not searched: a lock you can read through is not a lock.
   ========================================================================== */
/* not-story:begin — chrome */
var SEND_GLYPH = "↑";
var COMPOSE_HINT = "Message";
var COMPOSE_MUTE = "No one is answering";
var FIND_GLYPH = "⌕";
var FIND_PLACEHOLDER = "Search";
var FIND_NOTHING = "No messages found";
var FIND_PROMPT = "Type to search your messages";
var SPOT_HEAD = "one thing is different";
var SPOT_A = "tuesday";
var SPOT_B = "tonight";
var SPOT_FOUND = "found it";
var SPOT_MISS = "not there";
/* not-story:end */

function searchable(){
  var out = [];
  Story.threads().forEach(function(t){
    if(isLocked(t)) return;                 /* a lock you can read through is not a lock */
    (S.shown[t.id] || []).forEach(function(m){
      if(!m.body) return;
      out.push({ thread: t, m: m });
    });
  });
  return out;
}

function runSearch(query){
  scroll.innerHTML = "";
  var q = query.trim().toLowerCase();
  if(!q){
    var prompt = document.createElement("div");
    prompt.className = "empty";
    chromeText(prompt, FIND_PROMPT);
    scroll.appendChild(prompt);
    return 0;
  }
  var hits = searchable().filter(function(h){
    return h.m.body.toLowerCase().indexOf(q) >= 0;
  }).sort(function(a, b){ return b.m.offsetMinutes - a.m.offsetMinutes; });

  if(!hits.length){
    var none = document.createElement("div");
    none.className = "empty";
    chromeText(none, FIND_NOTHING);
    scroll.appendChild(none);
    return 0;
  }

  hits.slice(0, 60).forEach(function(h){
    var b = document.createElement("button");
    b.className = "hit";
    b.setAttribute("data-hit", h.m.id);
    var top = document.createElement("span");
    top.className = "top";
    var who = document.createElement("span");
    who.className = "who3";
    Text.paint(who, Story.threadName(h.thread));
    var when = document.createElement("span");
    when.className = "at";
    when.textContent = listStamp(h.m.offsetMinutes);   /* not-story: a stamp */
    top.appendChild(who); top.appendChild(when);

    /* the match is highlighted by splitting, never by building markup from the body */
    var line = document.createElement("span");
    line.className = "line";
    var body = h.m.body;
    var at = body.toLowerCase().indexOf(q);
    var before = document.createElement("span");
    Text.paint(before, Text.mint("story.message", body.slice(0, at)));
    var hitPart = document.createElement("mark");
    Text.paint(hitPart, Text.mint("story.message", body.slice(at, at + q.length)));
    var after = document.createElement("span");
    Text.paint(after, Text.mint("story.message", body.slice(at + q.length)));
    line.appendChild(before); line.appendChild(hitPart); line.appendChild(after);

    b.appendChild(top); b.appendChild(line);
    b.addEventListener("click", function(){ closeSearch(); openThread(h.thread); });
    scroll.appendChild(b);
  });
  return hits.length;
}

function openSearch(){
  S.searching = true;
  choicesEl.innerHTML = "";
  appbar.innerHTML = '<div class="searchbar"><button class="back" aria-label="Back">‹</button>'
                   + '<input id="q" type="search" autocomplete="off"></div>';
  var input = appbar.querySelector("#q");
  input.setAttribute("placeholder", FIND_PLACEHOLDER);   /* not-story: chrome */
  input.setAttribute("aria-label", FIND_PLACEHOLDER);
  appbar.querySelector(".back").addEventListener("click", closeSearch);
  input.addEventListener("input", function(){ runSearch(input.value); });
  input.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSearch(); });
  runSearch("");
  input.focus();
}
function closeSearch(){ S.searching = false; renderList(true); }

/* ============================================================================
   SPOT THE DIFFERENCE
   The hallway is generated, so a second one taken later costs nothing but a
   parameter. One thing is different, and it is on the floor.
   ========================================================================== */
var SPOT_TARGET = { x: 0.34, y: 0.86, r: 0.20 };

function spotWidget(m){
  var box = document.createElement("div");
  box.className = "spot";
  box.setAttribute("data-src", "story.game");
  box.setAttribute("data-game", "spot");
  var state = gameState(m.id);

  var head = document.createElement("div");
  head.className = "head";
  chromeText(head, SPOT_HEAD);
  var pair = document.createElement("div");
  pair.className = "pair";
  var note = document.createElement("div");
  note.className = "note2";

  [[0, SPOT_A], [1, SPOT_B]].forEach(function(pairing){
    var shot = document.createElement("div");
    shot.className = "shot";
    shot.appendChild(hallway(1, 0, pairing[0]));
    var tag = document.createElement("span");
    tag.className = "tag";
    chromeText(tag, pairing[1]);
    shot.appendChild(tag);
    var ring = document.createElement("span");
    ring.className = "ring";
    ring.style.left = (SPOT_TARGET.x * 100) + "%";
    ring.style.top = (SPOT_TARGET.y * 100) + "%";
    shot.appendChild(ring);
    if(pairing[0] === 1){
      shot.addEventListener("click", function(e){
        if(state.won) return;
        var b = shot.getBoundingClientRect();
        var nx = (e.clientX - b.left) / b.width;
        var ny = (e.clientY - b.top) / b.height;
        var dx = nx - SPOT_TARGET.x, dy = ny - SPOT_TARGET.y;
        if(Math.sqrt(dx * dx + dy * dy) <= SPOT_TARGET.r){
          state.won = true;
          Save.write(S.save);
          box.classList.add("solved");
          chromeText(note, SPOT_FOUND);
          Sound.play("receive");
        } else {
          var miss = document.createElement("span");
          miss.className = "miss";
          miss.style.left = (nx * 100) + "%";
          miss.style.top = (ny * 100) + "%";
          shot.appendChild(miss);
          chromeText(note, SPOT_MISS);
          Sound.play("send");
        }
      });
    }
    pair.appendChild(shot);
  });

  box.appendChild(head); box.appendChild(pair); box.appendChild(note);
  if(state.won){ box.classList.add("solved"); chromeText(note, SPOT_FOUND); }
  return box;
}

/* ============================================================================
   VOICE MEMO — kind:"audio" has been in the schema since v1 and never drawn.
   Synthesised like the chimes: room tone, and one thing in it. The memo is the
   mini-game -- you have to scrub to find the moment, and it is quiet enough that
   you will go back over it.
   ========================================================================== */
/* not-story:begin — chrome and glyphs */
var VM_PLAY = "▶";
var VM_PAUSE = "❚❚";
/* not-story:end */

var Memo = (function(){
  var buffers = {}, playing = null;

  function hash32(text){
    var h = 2166136261;
    for(var i = 0; i < text.length; i++){
      h ^= text.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h;
  }

  /* the shape you see, and the shape you hear, come from the same seed */
  function envelope(id, bars){
    var h = hash32(id), out = [];
    for(var i = 0; i < bars; i++){
      h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
      out.push(0.18 + (h % 1000) / 1000 * 0.16);
    }
    /* the event: a little over two thirds through, and only a little louder */
    var at = Math.floor(bars * 0.68);
    [-1, 0, 1].forEach(function(d, k){
      if(out[at + d] !== undefined) out[at + d] += [0.06, 0.19, 0.08][k];
    });
    return out;
  }

  function buffer(id, ms){
    if(buffers[id]) return buffers[id];
    var c = Sound.context();
    if(!c) return null;
    var rate = c.sampleRate, length = Math.floor(rate * ms / 1000);
    var buf = c.createBuffer(1, length, rate);
    var data = buf.getChannelData(0);
    var h = hash32(id), last = 0;
    for(var i = 0; i < length; i++){
      h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
      var white = ((h % 2000) / 1000) - 1;
      /* one-pole low pass: room tone rather than hiss */
      last = last + 0.06 * (white - last);
      data[i] = last * 0.055;
    }
    /* the thing in it: a short breath in, at 68% */
    var at = Math.floor(length * 0.68), span = Math.floor(rate * 0.42);
    for(var j = 0; j < span; j++){
      var t = j / span;
      var shape = Math.sin(Math.PI * t);
      h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
      var n = ((h % 2000) / 1000) - 1;
      if(at + j < length) data[at + j] += n * shape * 0.085;
    }
    buffers[id] = buf;
    return buf;
  }

  function stop(){
    if(playing){
      try { playing.src.stop(); } catch(e){}
      if(playing.raf) cancelAnimationFrame(playing.raf);
      if(playing.onEnd) playing.onEnd();
      playing = null;
    }
  }

  function play(id, ms, from, onTick, onEnd){
    stop();
    Sound.unlock();
    var c = Sound.context();
    var buf = buffer(id, ms);
    if(!c || !buf){ if(onEnd) onEnd(); return; }
    var src = c.createBufferSource();
    var gain = c.createGain();
    gain.gain.value = prefs.sound ? 1 : 0;
    src.buffer = buf;
    src.connect(gain); gain.connect(c.destination);
    var startedAt = c.currentTime;
    src.start(0, (from / 1000) * (buf.duration / (ms / 1000)));
    playing = { src: src, onEnd: onEnd, raf: null };
    (function tick(){
      if(!playing) return;
      var at = from + (c.currentTime - startedAt) * 1000;
      if(at >= ms){ stop(); return; }
      onTick(at);
      playing.raf = requestAnimationFrame(tick);
    })();
    src.onended = function(){ if(playing && playing.src === src) stop(); };
  }

  return { envelope: envelope, play: play, stop: stop, isPlaying: function(){ return !!playing; } };
})();

function memoWidget(m){
  var ms = m.durationMs || 7000;
  var bars = 34;
  var shape = Memo.envelope(m.id, bars);
  var at = 0;

  var box = document.createElement("div");
  box.className = "msg them vm";
  box.setAttribute("data-src", "story.audio");
  box.setAttribute("data-memo", m.id);

  var play = document.createElement("button");
  play.className = "play";
  play.textContent = VM_PLAY;              /* not-story: a glyph */
  var wave = document.createElement("div");
  wave.className = "wave";
  var dur = document.createElement("span");
  dur.className = "dur";

  shape.forEach(function(v){
    var bar = document.createElement("i");
    bar.style.height = Math.round(v * 100) + "%";
    wave.appendChild(bar);
  });

  function drawAt(value){
    at = Math.max(0, Math.min(ms, value));
    var upto = Math.floor((at / ms) * bars);
    Array.prototype.forEach.call(wave.children, function(bar, i){
      bar.classList.toggle("past", i < upto);
    });
    var secs = Math.max(0, Math.round((ms - at) / 1000));
    dur.textContent = "0:" + (secs < 10 ? "0" : "") + secs;
  }

  function stopUI(){ play.textContent = VM_PLAY; }

  play.addEventListener("click", function(){
    if(Memo.isPlaying()){ Memo.stop(); stopUI(); return; }
    play.textContent = VM_PAUSE;           /* not-story: a glyph */
    Memo.play(m.id, ms, at >= ms ? 0 : at, drawAt, function(){ stopUI(); drawAt(ms); });
  });

  /* scrubbing is the game: the thing in it is quiet and easy to pass over */
  function scrubTo(clientX){
    var box2 = wave.getBoundingClientRect();
    drawAt(((clientX - box2.left) / box2.width) * ms);
  }
  var scrubbing = false;
  wave.addEventListener("pointerdown", function(e){
    scrubbing = true; Memo.stop(); stopUI(); scrubTo(e.clientX);
    wave.setPointerCapture(e.pointerId);
  });
  wave.addEventListener("pointermove", function(e){ if(scrubbing) scrubTo(e.clientX); });
  wave.addEventListener("pointerup", function(){ scrubbing = false; });

  box.appendChild(play); box.appendChild(wave); box.appendChild(dur);
  drawAt(0);
  return box;
}

/* ============================================================================
   SWIPE THE CONVERSATION TO SEE WHEN THINGS HAPPENED
   The offsets have been exact since D24 and the player has never been able to
   read them. Drag left, and every message says when.
   ========================================================================== */
function wireSwipe(wrap){
  var startX = 0, dragging = false, shifted = false;
  var MAX = 58;   /* matched by .convo.shifted padding-left */
  function setShift(px){
    wrap.style.transform = "translateX(" + (-px) + "px)";
    wrap.classList.toggle("shifted", px > 20);
  }
  wrap.addEventListener("pointerdown", function(e){
    if(e.target.closest(".wave") || e.target.closest(".pad")) return;
    startX = e.clientX; dragging = true; wrap.classList.add("peeking");
  });
  wrap.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dx = startX - e.clientX;
    if(dx > 4) setShift(Math.min(MAX, dx));
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(type){
    wrap.addEventListener(type, function(){
      if(!dragging) return;
      dragging = false; wrap.classList.remove("peeking");
      shifted = !shifted && wrap.classList.contains("shifted");
      setShift(shifted ? MAX : 0);
    });
  });
}

/* ============================================================================
   THE STATUS BAR
   A phone that has been on for a hundred days. In act III the battery stops
   moving, and nothing explains that either.
   ========================================================================== */
function drawStatusBar(){
  var day = (S.save && S.save.day) || 1;
  var bars = document.getElementById("bars");
  var batt = document.getElementById("batt");
  if(!bars || !batt) return;

  var strength = day < 21 ? 4 : day < 61 ? 3 : 2;
  bars.innerHTML = "";
  for(var i = 1; i <= 4; i++){
    var b = document.createElement("i");
    b.style.height = (3 + i * 2) + "px";
    if(i <= strength) b.className = "on";
    bars.appendChild(b);
  }

  /* falls through acts I and II, then simply stops */
  var pct = day >= 61 ? 4 : Math.max(4, 64 - Math.floor(day * 1.0));
  batt.className = "batt" + (pct <= 10 ? " low" : "");
  batt.innerHTML = '<span class="cell"><span class="fill"></span></span><span class="pct"></span>';
  batt.querySelector(".fill").style.width = pct + "%";
  batt.querySelector(".pct").textContent = pct + "%";   /* not-story: a number */
}

/* ============================================================================
   KEYPAD — one component, two uses: a locked thread and a guessing game.
   ========================================================================== */
/* not-story:begin — chrome and glyphs */
var PAD_GAME_HEAD = "im thinking of a number";
var PAD_RANGE = "1 to 50";
var PAD_HIGHER = "higher";
var PAD_LOWER = "lower";
var PAD_GOT_IT = "got it";
var PAD_CLEAR = "clear";
var PAD_GO = "enter";
var LOCK_GLYPH = "🔒";
var LOCK_CAP = "this chat is locked";
var LOCK_WRONG = "wrong code";
var LOCK_HINT = "four digits";
/* not-story:end */

function chromeText(el, text){ Text.paint(el, Text.mint("ui.chrome", text)); }

function makeKeypad(digits, onSubmit){
  var wrap = document.createElement("div");
  var out = document.createElement("div");
  out.className = "padout";
  var msg = document.createElement("div");
  msg.className = "padmsg";
  var pad = document.createElement("div");
  pad.className = "pad";
  var buffer = "";

  function draw(){ out.textContent = buffer || "·".repeat(digits); }

  function key(label, cls, fn){
    var b = document.createElement("button");
    if(cls) b.className = cls;
    b.textContent = label;                 /* not-story: a digit or a glyph */
    b.setAttribute("data-key", label);
    b.addEventListener("click", function(){ fn(); Sound.play("send"); });
    return b;
  }

  ["1","2","3","4","5","6","7","8","9"].forEach(function(d){
    pad.appendChild(key(d, null, function(){
      if(buffer.length < digits){ buffer += d; draw(); }
    }));
  });
  pad.appendChild(key("⌫", null, function(){ buffer = buffer.slice(0, -1); draw(); }));
  pad.appendChild(key("0", null, function(){
    if(buffer.length < digits){ buffer += "0"; draw(); }
  }));
  pad.appendChild(key("⏎", "go", function(){
    if(!buffer.length) return;
    var verdict = onSubmit(buffer, msg);
    if(verdict !== "keep"){ buffer = ""; draw(); }
  }));

  draw();
  wrap.appendChild(out);
  wrap.appendChild(msg);
  wrap.appendChild(pad);
  wrap.pad = pad;
  return wrap;
}

/* ---- locked threads ------------------------------------------------------- */
function unlockedThreads(){
  if(!S.save) return {};
  return S.save.unlocked || (S.save.unlocked = {});
}
function isLocked(t){
  return !!t.lockedBy && !unlockedThreads()[t.id];
}

function paintLocked(t){
  var wrap = document.createElement("div");
  wrap.className = "locked";
  var glyph = document.createElement("div");
  glyph.className = "glyph";
  glyph.textContent = LOCK_GLYPH;          /* not-story: a glyph */
  var cap = document.createElement("div");
  cap.className = "cap";
  chromeText(cap, LOCK_CAP);
  wrap.appendChild(glyph);
  wrap.appendChild(cap);
  wrap.appendChild(makeKeypad(String(t.lockedBy).length, function(entry, msg){
    if(entry === String(t.lockedBy)){
      unlockedThreads()[t.id] = true;
      Save.write(S.save);
      Sound.play("receive");
      openThread(t);
      return "done";
    }
    msg.className = "padmsg bad";
    chromeText(msg, LOCK_WRONG);
    return "reset";
  }));
  var hint = document.createElement("div");
  hint.className = "padmsg";
  chromeText(hint, LOCK_HINT);
  wrap.appendChild(hint);
  scroll.innerHTML = "";
  scroll.appendChild(wrap);
}

/* ---- the guessing game ---------------------------------------------------- */
function gameState(id){
  if(!S.save) return null;
  var all = S.save.games || (S.save.games = {});
  return all[id] || (all[id] = { tries: [], won: false });
}

/* the number is the seed's, so the same run always hides the same one */
function secretFor(id){
  var seed = (S.save && S.save.runSeed) || "default";
  var h = 2166136261;
  var text = seed + "|" + id;
  for(var i = 0; i < text.length; i++){
    h ^= text.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return (h % 50) + 1;
}

function gameWidget(m){
  var box = document.createElement("div");
  box.className = "game";
  box.setAttribute("data-src", "story.game");
  box.setAttribute("data-game", m.game);
  var state = gameState(m.id);
  var secret = secretFor(m.id);

  var head = document.createElement("div");
  head.className = "head";
  chromeText(head, PAD_GAME_HEAD + ", " + PAD_RANGE);
  box.appendChild(head);

  var tries = document.createElement("div");
  tries.className = "tries";
  function drawTries(){
    tries.innerHTML = "";
    state.tries.forEach(function(t){
      var chip = document.createElement("span");
      chip.className = "try " + (t.n < secret ? "up" : t.n > secret ? "down" : "");
      chip.textContent = String(t.n);      /* not-story: a number */
      tries.appendChild(chip);
    });
  }

  var pad = makeKeypad(2, function(entry, msg){
    var n = parseInt(entry, 10);
    if(!n || n < 1 || n > 50) return "reset";
    state.tries.push({ n: n });
    Save.write(S.save);
    drawTries();
    if(n === secret){
      state.won = true;
      Save.write(S.save);
      msg.className = "padmsg good";
      chromeText(msg, PAD_GOT_IT);
      box.classList.add("done");
      Sound.play("receive");
      /* the whole point of Act III's version: it never has to guess */
      if(m.__mocking) return "done";
      return "done";
    }
    msg.className = "padmsg";
    chromeText(msg, n < secret ? PAD_HIGHER : PAD_LOWER);
    return "reset";
  });

  box.appendChild(tries);
  box.appendChild(pad);
  drawTries();
  if(state.won) box.classList.add("done");
  return box;
}


/* ============================================================================
   RECALL
   A hundred days is longer than anyone's memory of what they clicked. The number
   remembers. Getting it wrong is the point of the beat; getting it right is the
   reason to keep coming back.
   ========================================================================== */
/* not-story:begin — chrome */
var RECALL_HEAD  = "which one did you say";
var RECALL_RIGHT = "yes. that one";
var RECALL_WRONG = "no. you said";
var RECALL_NONE  = "you havent said anything yet";
/* not-story:end */

/* mulberry32 off the same fnv hash secretFor uses, so a run's quiz is the run's. */
function seededRand(key){
  var seed = (S.save && S.save.runSeed) || "default";
  var h = 2166136261, text = seed + "|" + key;
  for(var i = 0; i < text.length; i++){
    h ^= text.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return function(){
    h = (h + 0x6D2B79F5) >>> 0;
    var t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Every fragment any choice could have written, minus the slotted ones (a decoy with
   {CHORE} still in it is not a decoy, it is a bug). */
function allFragments(){
  var out = [], seen = {};
  ((CONTENT.templates && CONTENT.templates.templates) || []).forEach(function(tpl){
    (tpl.choices || []).forEach(function(c){
      var f = c.memory && c.memory.fragment;
      if(!f || /\{[A-Z0-9_]+\}/.test(f) || seen[f]) return;
      seen[f] = true; out.push(f);
    });
  });
  return out;
}

/* Stable per message: the same three lines in the same order every time you open the
   thread, because a quiz that reshuffles itself is a quiz you cannot be wrong about. */
function recallOptions(id){
  var bank = (S.save && S.save.contactState && S.save.contactState.memory) || {};
  var mine = Object.keys(bank).map(function(k){ return bank[k]; })
    .filter(function(f){ return f && !/\{[A-Z0-9_]+\}/.test(f); });
  if(!mine.length) return null;

  var r = seededRand(id + "|recall");
  var truth = mine[Math.floor(r() * mine.length) % mine.length];
  var pool = allFragments().filter(function(f){ return mine.indexOf(f) < 0; });
  var opts = [truth];
  while(opts.length < 3 && pool.length){
    opts.push(pool.splice(Math.floor(r() * pool.length) % pool.length, 1)[0]);
  }
  /* deterministic shuffle */
  for(var i = opts.length - 1; i > 0; i--){
    var j = Math.floor(r() * (i + 1)) % (i + 1);
    var tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
  }
  return { truth: truth, options: opts };
}

function recallWidget(m){
  var box = document.createElement("div");
  box.className = "recall";
  box.setAttribute("data-src", "story.game");
  box.setAttribute("data-game", "recall");

  var head = document.createElement("div");
  head.className = "head";
  var note = document.createElement("div");
  note.className = "note2";
  var opts = document.createElement("div");
  opts.className = "opts";
  box.appendChild(head); box.appendChild(opts); box.appendChild(note);

  var q = recallOptions(m.id);
  if(!q){
    chromeText(head, RECALL_NONE);
    return box;
  }
  chromeText(head, RECALL_HEAD);

  var state = gameState(m.id);
  function settle(){
    box.classList.add("done");
    Array.prototype.forEach.call(opts.children, function(b){
      b.classList.add(b.getAttribute("data-line") === q.truth ? "right" : "wrong");
    });
    chromeText(note, state.won ? RECALL_RIGHT : RECALL_WRONG);
  }

  q.options.forEach(function(line){
    var b = document.createElement("button");
    b.className = "opt";
    b.setAttribute("data-line", line);
    /* the fragments are story, and go through the one ingress like everything else */
    Text.paint(b, Text.mint("story.message", line));
    b.addEventListener("click", function(){
      if(state.done) return;
      state.done = true;
      state.won = line === q.truth;
      Save.write(S.save);
      settle();
      Sound.play(state.won ? "receive" : "send");
    });
    opts.appendChild(b);
  });

  if(state.done) settle();
  return box;
}


/* ============================================================================
   MATCH
   Three pairs and one tile that has no partner. Nobody counts the tiles.
   ========================================================================== */
/* not-story:begin — glyphs and chrome */
var MATCH_FACES = ["◆", "▲", "●"];
var MATCH_BACK  = "·";
var MATCH_HEAD  = "find the pairs";
var MATCH_DONE  = "all of them";
var MATCH_ODD   = "";
/* not-story:end */

var MATCH_FLIP_MS = 620;

function matchWidget(m){
  var box = document.createElement("div");
  box.className = "match";
  box.setAttribute("data-src", "story.game");
  box.setAttribute("data-game", "match");
  var state = gameState(m.id);
  if(!state.found) state.found = [];

  var head = document.createElement("div");
  head.className = "head";
  chromeText(head, MATCH_HEAD);
  var grid = document.createElement("div");
  grid.className = "grid";
  var note = document.createElement("div");
  note.className = "note2";
  box.appendChild(head); box.appendChild(grid); box.appendChild(note);

  /* three pairs plus the one that has no partner, shuffled by the run's seed */
  var deck = MATCH_FACES.concat(MATCH_FACES).concat([null]);
  var r = seededRand(m.id + "|match");
  for(var i = deck.length - 1; i > 0; i--){
    var j = Math.floor(r() * (i + 1)) % (i + 1);
    var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }

  var busy = false, up = [];

  function isFound(face){ return face !== null && state.found.indexOf(face) >= 0; }

  function tileFor(face, index){
    var t = document.createElement("button");
    t.className = "tile";
    t.setAttribute("data-face", face === null ? "odd" : face);
    var f = document.createElement("span");
    f.className = "face";
    t.appendChild(f);

    function show(on){
      t.classList.toggle("up", on);
      f.textContent = on ? (face === null ? MATCH_ODD : face) : MATCH_BACK;
    }
    t.__show = show;
    t.__face = face;
    t.__index = index;
    show(isFound(face));
    if(isFound(face)) t.classList.add("kept");

    t.addEventListener("click", function(){
      if(busy || t.classList.contains("kept") || up.indexOf(t) >= 0) return;
      show(true);
      up.push(t);
      Sound.play("send");
      if(up.length < 2) return;
      busy = true;
      var a = up[0], b = up[1];
      if(a.__face !== null && a.__face === b.__face){
        state.found.push(a.__face);
        Save.write(S.save);
        a.classList.add("kept"); b.classList.add("kept");
        up = []; busy = false;
        Sound.play("receive");
        if(state.found.length === MATCH_FACES.length) finish();
      } else {
        window.setTimeout(function(){
          a.__show(false); b.__show(false);
          up = []; busy = false;
        }, MATCH_FLIP_MS);
      }
    });
    return t;
  }

  function finish(){
    state.won = true;
    Save.write(S.save);
    box.classList.add("done");
    chromeText(note, MATCH_DONE);
    /* the tile nobody asked about turns over on its own */
    window.setTimeout(function(){
      var odd = grid.querySelector('[data-face="odd"]');
      if(odd){ odd.__show(true); odd.classList.add("kept", "odd"); }
      Sound.play("pulse"); Haptics.fire("pulse");
    }, MATCH_FLIP_MS);
  }

  deck.forEach(function(face, index){ grid.appendChild(tileFor(face, index)); });
  if(state.won){
    box.classList.add("done");
    chromeText(note, MATCH_DONE);
    var odd = grid.querySelector('[data-face="odd"]');
    if(odd){ odd.__show(true); odd.classList.add("kept", "odd"); }
  }
  return box;
}

/* ============================================================================
   REACTIONS — the toy, and the trace.
   Hold a message to react to it. It is the most ordinary thing a messenger does,
   it is genuinely nice to use, and it is the only part of the game that records
   how the player behaves rather than what they chose. Act II starts using it.
   ========================================================================== */
/* not-story:begin — chrome and glyphs, no dialogue below */
var REACTIONS = ["👍", "❤️", "😂", "😮", "❓"];
var VIEWER_HINT = "pinch or scroll to zoom";
var VIEWER_CLOSE = "Close";
/* not-story:end */

var HOLD_MS = 420;

function reactionsBank(){
  if(!S.save) return {};
  return S.save.reactions || (S.save.reactions = {});
}

/* The emoji the player reaches for most. Act II answers with it. */
function favouriteReaction(){
  var counts = {}, best = null;
  var bank = reactionsBank();
  Object.keys(bank).forEach(function(id){
    counts[bank[id]] = (counts[bank[id]] || 0) + 1;
    if(best === null || counts[bank[id]] > counts[best]) best = bank[id];
  });
  return best;
}

function reactionCount(){ return Object.keys(reactionsBank()).length; }

/* From act II, anything the player said in the unnamed thread comes back reacted to,
   in the player's own most-used emoji. Nobody taught it that. */
function theirReactionFor(m){
  if(!m || m.from !== "me") return null;
  if(!S.save || (S.save.day || 1) < 21) return null;
  if(m.__threadId !== UNKNOWN && (!S.current || S.current.id !== UNKNOWN)) return null;
  var fav = favouriteReaction();
  if(!fav || reactionCount() < 2) return null;
  return fav;
}

function setReaction(messageId, emoji){
  var bank = reactionsBank();
  if(bank[messageId] === emoji) delete bank[messageId];
  else bank[messageId] = emoji;
  Save.write(S.save);
  if(S.current) { paint(S.current); scroll.scrollTop = scroll.scrollHeight; }
}

function closePicker(){
  var open = document.querySelector(".picker");
  if(open) open.remove();
  Array.prototype.forEach.call(document.querySelectorAll(".msg.held"), function(el){
    el.classList.remove("held");
  });
}

function openPicker(el, messageId){
  closePicker();
  el.classList.add("held");
  var picker = document.createElement("div");
  picker.className = "picker";
  REACTIONS.forEach(function(emoji){
    var b = document.createElement("button");
    b.textContent = emoji;                     /* not-story: a glyph, not a line */
    b.setAttribute("data-react", emoji);
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      setReaction(messageId, emoji);
      Sound.play("send");
      closePicker();
    });
    picker.appendChild(b);
  });
  document.querySelector(".phone").appendChild(picker);
  var box = el.getBoundingClientRect();
  var phone = document.querySelector(".phone").getBoundingClientRect();
  var top = box.top - phone.top - 46;
  picker.style.top = Math.max(6, top) + "px";
  picker.style.left = Math.max(6, Math.min(
    box.left - phone.left, phone.width - picker.offsetWidth - 6)) + "px";
}

document.addEventListener("click", function(e){
  if(!e.target.closest(".picker")) closePicker();
});

/* hold, double-click, right-click, or the keyboard: four ways in, one behaviour */
function wireReactable(el, m){
  if(!m || !m.id) return;
  el.setAttribute("tabindex", "0");
  el.setAttribute("data-msg", m.id);
  var timer = null;
  var open = function(){ openPicker(el, m.id); };
  el.addEventListener("pointerdown", function(){
    timer = setTimeout(open, HOLD_MS);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function(type){
    el.addEventListener(type, function(){ clearTimeout(timer); });
  });
  el.addEventListener("dblclick", open);
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); open(); });
  el.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); }
  });
}

function paintReaction(el, m){
  var mine = reactionsBank()[m.id];
  var theirs = theirReactionFor(m);
  if(!mine && !theirs) return;
  var chip = document.createElement("span");
  chip.className = "react" + (!mine && theirs ? " theirs" : "");
  chip.textContent = mine || theirs;           /* not-story: a glyph */
  if(mine && theirs){
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = "2";                       /* not-story: a count */
    chip.appendChild(n);
    chip.classList.add("theirs");
  }
  el.appendChild(chip);
}

/* ============================================================================
   THE PHOTO, OPENED
   The hallway is drawn, so zooming is not a bigger file -- it is a bigger draw.
   Look closely enough and the doorway is not empty.
   ========================================================================== */
var viewer = {
  zoom: 1, x: 0, y: 0, canvas: null,
  open: function(){
    var stage = document.getElementById("vstage");
    document.querySelector(".phone").scrollTop = 0;
    stage.innerHTML = "";
    this.zoom = 1; this.x = 0; this.y = 0;
    this.canvas = hallway(3, 0);
    this.canvas.style.width = "min(92vw, 340px)";
    stage.appendChild(this.canvas);
    this.apply();
    Text.paint(document.getElementById("vhint"), Text.mint("ui.chrome", VIEWER_HINT));
    var v = document.getElementById("viewer");
    v.classList.add("on");
    v.setAttribute("aria-hidden", "false");
  },
  close: function(){
    var v = document.getElementById("viewer");
    v.classList.remove("on");
    v.setAttribute("aria-hidden", "true");
  },
  apply: function(){
    if(!this.canvas) return;
    this.canvas.style.transform =
      "translate(" + this.x + "px," + this.y + "px) scale(" + this.zoom + ")";
    document.getElementById("vzoom").textContent = this.zoom.toFixed(1) + "×";
  },
  setZoom: function(next){
    var before = this.zoom;
    this.zoom = Math.max(1, Math.min(6, next));
    if(this.zoom === 1){ this.x = 0; this.y = 0; }
    /* the grain and what is behind it are only resolved when someone looks */
    var wasClose = before >= 2.6, isClose = this.zoom >= 2.6;
    if(wasClose !== isClose){
      var stage = document.getElementById("vstage");
      var fresh = hallway(3, isClose ? 1 : 0);
      fresh.style.width = "min(92vw, 340px)";
      stage.innerHTML = "";
      stage.appendChild(fresh);
      this.canvas = fresh;
    }
    this.apply();
  }
};

(function wireViewer(){
  var stage = document.getElementById("vstage");
  document.getElementById("vclose").addEventListener("click", function(){ viewer.close(); });
  document.getElementById("vclose").setAttribute("aria-label", VIEWER_CLOSE);
  stage.addEventListener("wheel", function(e){
    e.preventDefault();
    viewer.setZoom(viewer.zoom * (e.deltaY < 0 ? 1.18 : 0.85));
  }, { passive: false });
  stage.addEventListener("dblclick", function(){
    viewer.setZoom(viewer.zoom >= 2.6 ? 1 : 3);
  });
  var dragging = false, lastX = 0, lastY = 0;
  stage.addEventListener("pointerdown", function(e){
    if(viewer.zoom <= 1) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add("dragging");
  });
  window.addEventListener("pointermove", function(e){
    if(!dragging) return;
    viewer.x += e.clientX - lastX; viewer.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    viewer.apply();
  });
  window.addEventListener("pointerup", function(){
    dragging = false; stage.classList.remove("dragging");
  });
  document.addEventListener("keydown", function(e){
    if(document.getElementById("viewer").classList.contains("on")){
      if(e.key === "Escape") viewer.close();
      if(e.key === "+" || e.key === "=") viewer.setZoom(viewer.zoom * 1.25);
      if(e.key === "-") viewer.setZoom(viewer.zoom * 0.8);
    }
  });
})();

/* ============================================================================
   SOUND — synthesised, never loaded.
   Rule 1: the artifact loads nothing but a font. An audio file would either break
   that or bloat the build as base64, and a notification chime is four oscillators.
   ========================================================================== */
var Sound = (function(){
  var ctx = null, unlocked = false;
  var log = [];              /* what was played, so the gate can hear it */

  function context(){
    if(ctx) return ctx;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    try { ctx = new Ctor(); } catch(e){ ctx = null; }
    return ctx;
  }

  /* Browsers refuse audio until the player has touched something, which is correct
     and also means the first chime must not be swallowed. */
  function unlock(){
    var c = context();
    if(!c) return;
    if(c.state === "suspended") c.resume();
    unlocked = true;
  }

  function tone(opts){
    var c = context();
    if(!c || c.state === "suspended") return;
    var now = c.currentTime + (opts.at || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.setValueAtTime(opts.from, now);
    if(opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, now + opts.length);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(opts.gain, now + (opts.attack || 0.008));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + opts.length);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(now); osc.stop(now + opts.length + 0.02);
  }

  function play(name){
    log.push(name);
    if(!prefs.sound) return;
    unlock();
    if(name === "receive"){
      /* almost, but not quite, the one you know */
      tone({ from: 987.77, to: 1318.5, length: 0.16, gain: 0.05, attack: 0.004 });
      tone({ from: 1318.5, length: 0.22, gain: 0.028, at: 0.075 });
    } else if(name === "send"){
      tone({ from: 1244.5, length: 0.10, gain: 0.022, attack: 0.003 });
    } else if(name === "pulse"){
      /* the two-beat. Low enough that a phone speaker mostly gives you the cabinet. */
      tone({ from: 72, to: 52, length: 0.55, gain: 0.10, attack: 0.05, type: "sine" });
      tone({ from: 68, to: 48, length: 0.70, gain: 0.09, attack: 0.06, at: 0.42 });
    }
  }

  return {
    play: play,
    unlock: unlock,
    context: context,
    log: function(){ return log.slice(); },
    clear: function(){ log = []; }
  };
})();

/* ============================================================================
   HAPTICS — restraint is the point (Phase 5, kept).
   A light tick for a message landing; the slow two-beat reserved for the two
   moments the content marks, and rule 17 refuses a third.
   ========================================================================== */
var Haptics = {
  log: [],
  fire: function(kind){
    this.log.push(kind);
    if(!prefs.vibrate || !navigator.vibrate) return;
    if(kind === "tick") navigator.vibrate(12);
    else if(kind === "pulse") navigator.vibrate([90, 130, 110]);
  },
  clear: function(){ this.log = []; }
};

/* Anything a live message should be felt or heard as, in one place. */
function announce(m){
  if(m.emphasis === "pulse"){
    Sound.play("pulse");
    Haptics.fire("pulse");
    return;
  }
  if(m.from === "me"){
    Sound.play("send");
    return;
  }
  Sound.play("receive");
  Haptics.fire("tick");
}

["pointerdown", "keydown"].forEach(function(type){
  window.addEventListener(type, function once(){
    Sound.unlock();
    window.removeEventListener(type, once);
  });
});

/* ============================================================================
   SETTINGS — Loop's own settings screen.
   Diegetic on purpose. The founding rule is no title screen and no menu; a
   messenger having a settings page is not a menu, it is the app being an app.
   ========================================================================== */

/* not-story:begin — every string below is UI chrome, none of it is dialogue */
var CHROME = {
  settings:      "Settings",
  account:       "Account",
  notifications: "Notifications",
  display:       "Display",
  privacy:       "Privacy",
  storage:       "Storage",
  about:         "About",
  sound:         "Sound",
  soundSub:      "Message tones",
  alerts:        "Message alerts",
  alertsSub:     "Highlight a thread when something arrives",
  vibrate:       "Vibrate",
  vibrateSub:    "On this device only",
  textSize:      "Text size",
  small:         "S",
  medium:        "M",
  large:         "L",
  reduceMotion:  "Reduce motion",
  timestamps:    "Timestamps",
  blocked:       "Blocked",
  blockedNone:   "No blocked numbers",
  blockThis:     "Block this number",
  blockFailed:   "Couldn't block this number. Try again later.",
  messages:      "Messages",
  onDevice:      "On this device",
  version:       "Loop",
  versionNo:     "4.2.1",
  fiction:       "A WORK OF FICTION",
  reset:         "Reset this device",
  resetSub:      "Erases everything and starts again",
  resetConfirm:  "Erase everything?",
  cancel:        "Cancel",
  erase:         "Erase",

  activity:      "Activity",
