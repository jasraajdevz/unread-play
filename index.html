<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    /* a colder ground, a warmer ink: the phone should feel lit from inside */
    --ground:#05060A; --phone:#101319; --bar:#141821; --line:#1D2330;
    --them:#1C222C; --them2:#20262F; --me:#2F3E4C; --me2:#374858;
    --ink:#E4E8ED; --dim:#8E97A3; --faint:#5D6773;
    --alert:#C0484B; --instr:#C79647; --good:#7FA087;
    --lift:0 1px 0 rgba(255,255,255,.028) inset;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#0A0D14 0%,var(--ground) 62%);
    color:var(--ink); margin:0; min-height:100vh; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; gap:12px;
  }
  .phone{
    width:100%; max-width:390px; height:min(780px,88vh); background:var(--phone);
    border:1px solid #232A36; border-radius:30px; overflow:clip;
    box-shadow:0 34px 90px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset,
               0 1px 0 rgba(255,255,255,.05) inset;
    display:flex; flex-direction:column; position:relative;
  }
  .statusbar{
    height:32px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .appbar{
    flex:none; height:52px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#171C26,#141821);
    box-shadow:var(--lift), 0 6px 18px -12px rgba(0,0,0,.9);
    display:flex; align-items:center; gap:6px; padding:0 10px; position:relative; z-index:2;
  }
  .appbar .title{font-size:17px;font-weight:650;letter-spacing:-.015em;flex:1;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .back{background:none;border:none;padding:4px 8px;margin-left:-8px;color:var(--dim);
        font-size:22px;line-height:1;cursor:pointer;}
  .back:hover{color:var(--ink);}
  .sback{background:none;border:none;padding:4px 8px;margin-left:-8px;
         color:var(--dim);font-size:22px;line-height:1;cursor:pointer;}
  .sback:hover{color:var(--ink);}
  .sback:focus-visible{outline:2px solid var(--instr);outline-offset:-2px;}
  .scroll{flex:1;overflow-y:auto;}

  .row{display:flex;gap:12px;align-items:center;padding:12px 14px;
       border:none;border-bottom:1px solid var(--line);background:none;width:100%;
       text-align:left;cursor:pointer;font-family:inherit;}
  .row{transition:background .12s var(--ease);}
  .row:hover{background:#161B24;}
  .row:active{background:#1A2029;}
  .avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;
          font-size:16px;font-weight:650;color:#0A0C10;position:relative;
          box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 4px 10px -6px rgba(0,0,0,.9);}
  .avatar::after{content:"";position:absolute;inset:0;border-radius:50%;
                 background:linear-gradient(160deg,rgba(255,255,255,.20),transparent 62%);}
  .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rn{font-size:15px;font-weight:650;letter-spacing:-.012em;}
  .rtime{font-size:12px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums;}
  .rp{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--alert);
       flex:none;color:#fff;font-size:11px;font-weight:650;line-height:19px;text-align:center;
       font-variant-numeric:tabular-nums;
       box-shadow:0 2px 8px -3px rgba(192,72,75,.9);}

  .convo{display:flex;flex-direction:column;gap:3px;padding:16px 12px 22px;}
  .msg{max-width:76%;padding:9px 13px;border-radius:19px;font-size:var(--text);
       line-height:1.38;word-wrap:break-word;letter-spacing:-.004em;
       box-shadow:var(--lift);}
  .msg.them{background:linear-gradient(180deg,var(--them2),var(--them));
             align-self:flex-start;border-bottom-left-radius:7px;}
  .msg.me{background:linear-gradient(180deg,var(--me2),var(--me));color:#EEF2F6;
          align-self:flex-end;border-bottom-right-radius:7px;}
  .msg.run{border-radius:19px;}
  .msg.them.run{border-bottom-left-radius:19px;}
  .msg.me.run{border-bottom-right-radius:19px;}
  .msg.live{animation:pop .3s var(--ease);}
  .who{display:block;font-size:11px;color:var(--faint);margin-bottom:3px;
       letter-spacing:.02em;font-weight:550;}
  .divider{align-self:center;font-size:11px;color:var(--faint);padding:18px 0 12px;
           letter-spacing:.07em;text-transform:uppercase;font-weight:550;}
  .stamp{align-self:center;font-size:11px;color:var(--faint);padding:6px 0 2px;}
  .photo{align-self:flex-start;max-width:76%;border-radius:14px;overflow:hidden;
         border-bottom-left-radius:5px;line-height:0;animation:pop .22s ease-out;}
  .photo canvas{width:100%;display:block;}
  .typing{align-self:flex-start;background:var(--them);border-radius:16px;
          border-bottom-left-radius:5px;padding:11px 14px;display:flex;gap:4px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.3s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
  @keyframes pop{from{opacity:0;transform:translateY(7px) scale(.985);}
                 to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.55;}.msg.live,.photo{animation:none;}}

  .choices{flex:none;border-top:1px solid var(--line);
           background:linear-gradient(180deg,#141821,#11151D);
           box-shadow:0 -10px 24px -18px rgba(0,0,0,.95);
           padding:11px 12px 13px;display:flex;flex-direction:column;gap:8px;}
  .choice{width:100%;padding:12px 15px;border:1px solid #29313D;border-radius:22px;
          background:linear-gradient(180deg,#1A2029,#161B23);color:var(--ink);
          font-family:inherit;font-size:14px;letter-spacing:-.004em;
          text-align:left;cursor:pointer;box-shadow:var(--lift);
          transition:transform .12s var(--ease),background .15s,border-color .15s;}
  .choice:hover{background:linear-gradient(180deg,#1F2732,#1A202A);border-color:#3B4653;}
  .choice:active{transform:scale(.985);}
  .choice:focus-visible{outline:2px solid var(--instr);outline-offset:2px;}

  .end{position:absolute;inset:0;background:#08090C;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;
       opacity:0;pointer-events:none;transition:opacity 1.6s ease;}
  .end.on{opacity:1;pointer-events:auto;}
  .end p{font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.7;color:var(--dim);
         margin:0;max-width:30ch;white-space:pre-line;}
  .end .t{color:var(--instr);letter-spacing:.18em;text-transform:uppercase;font-size:11px;}
  .end button{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
              color:var(--faint);background:none;border:1px solid var(--line);
              border-radius:6px;padding:8px 14px;cursor:pointer;}
  .end button:hover{color:var(--ink);}


  /* ---- refinements ------------------------------------------------------- */
  :root{ --text:15px; --radius:16px; }
  .msg{font-size:var(--text);}
  .rp,.rn{transition:color .15s;}
  .row:focus-visible,.choice:focus-visible,.back:focus-visible,.cog:focus-visible{
    outline:2px solid var(--instr); outline-offset:-2px;}
  .row.pulse{animation:pulse .9s ease-out;}
  @keyframes pulse{0%{background:#20262F;}100%{background:none;}}
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:#242B35;border-radius:3px;}
  .scroll::-webkit-scrollbar-track{background:transparent;}
  body.reduce .msg.live,body.reduce .photo,body.reduce .row.pulse{animation:none;}
  body.reduce .typing i{animation:none;opacity:.55;}
  body.notimestamps .stamp{display:none;}

  .cog{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;
       padding:4px 6px;margin-right:-4px;cursor:pointer;}
  .cog:hover{color:var(--ink);}

  /* ---- the settings sheet ------------------------------------------------- */
  .sheet{position:absolute;inset:0;background:var(--phone);display:flex;
         flex-direction:column;transform:translateY(100%);transition:transform .28s
         cubic-bezier(.4,0,.2,1);z-index:5;}
  .sheet.on{transform:none;}
  body.reduce .sheet{transition:none;}
  .sheet .scroll{padding-bottom:24px;}
  .sgroup{padding:18px 16px 6px;font-size:11px;letter-spacing:.09em;color:var(--faint);
          text-transform:uppercase;}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 16px;
        border-bottom:1px solid var(--line);font-size:14px;min-height:48px;}
  .srow .lbl{flex:1;min-width:0;}
  .srow .sub{display:block;font-size:11px;color:var(--faint);margin-top:2px;}
  .srow .val{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px;}
  button.srow{width:100%;background:none;border:none;border-bottom:1px solid var(--line);
              color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;}
  button.srow:hover{background:#171C23;}
  .srow.danger .lbl{color:var(--alert);}

  .me-card{display:flex;gap:14px;align-items:center;padding:20px 16px;
           border-bottom:1px solid var(--line);}
  .me-card .avatar{width:52px;height:52px;font-size:19px;}
  .me-card .col{display:flex;flex-direction:column;min-width:0;flex:1;}
  .me-card .who2{font-size:17px;font-weight:600;}
  .me-card .sub{font-size:12px;color:var(--faint);margin-top:3px;}

  .toggle{width:42px;height:25px;border-radius:13px;background:#2A323D;border:none;
          position:relative;cursor:pointer;flex:none;transition:background .18s;}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;
                 border-radius:50%;background:#6D7784;transition:transform .18s,background .18s;}
  .toggle[aria-checked="true"]{background:#3E5B45;}
  .toggle[aria-checked="true"]::after{transform:translateX(17px);background:#CFE0D3;}
  body.reduce .toggle,body.reduce .toggle::after{transition:none;}

  .seg{display:flex;gap:4px;flex:none;}
  .seg button{background:#1B2029;border:1px solid #262E39;color:var(--dim);
              font-family:inherit;font-size:12px;padding:5px 11px;border-radius:7px;
              cursor:pointer;}
  .seg button[aria-pressed="true"]{background:#2E3A45;color:var(--ink);border-color:#3A4551;}

  .note{padding:14px 16px 4px;font-size:11px;line-height:1.55;color:var(--faint);}
  .fail{padding:10px 16px;font-size:12px;color:var(--alert);}


  /* ---- reactions ---------------------------------------------------------- */
  .msg{position:relative;}
  .msg.held{filter:brightness(1.35);}
  body.reduce .msg.held{filter:none;outline:1px solid var(--instr);}
  .react{position:absolute;bottom:-9px;font-size:12px;line-height:1;padding:2px 5px;
         border-radius:10px;background:#12161C;border:1px solid var(--line);
         white-space:nowrap;}
  .msg.them .react{left:8px;}
  .msg.me .react{right:8px;}
  .react.theirs{border-color:#3A2A2C;background:#17110F;}
  .react .n{color:var(--faint);margin-left:3px;font-size:10px;}

  .picker{position:absolute;z-index:8;display:flex;gap:2px;padding:5px;
          background:#171B21;border:1px solid var(--line);border-radius:20px;
          box-shadow:0 8px 26px rgba(0,0,0,.6);}
  .picker button{background:none;border:none;font-size:19px;line-height:1;padding:4px 5px;
                 border-radius:50%;cursor:pointer;}
  .picker button:hover{background:#232B35;}
  .picker button:focus-visible{outline:2px solid var(--instr);}

  /* ---- the photo, opened -------------------------------------------------- */
  .viewer{position:absolute;inset:0;z-index:9;background:#000;display:flex;
          flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s;}
  .viewer.on{opacity:1;pointer-events:auto;}
  body.reduce .viewer{transition:none;}
  .viewer .vbar{flex:none;height:46px;display:flex;align-items:center;
                justify-content:space-between;padding:0 14px;color:var(--dim);
                font-size:12px;font-variant-numeric:tabular-nums;}
  .viewer .vclose{background:none;border:none;color:var(--dim);font-size:24px;
                  line-height:1;cursor:pointer;padding:2px 6px;}
  .viewer .vclose:hover{color:var(--ink);}
  .viewer .stage{flex:1;overflow:hidden;display:grid;place-items:center;
                 touch-action:none;cursor:grab;}
  .viewer .stage.dragging{cursor:grabbing;}
  .viewer canvas{transform-origin:center center;image-rendering:auto;}
  .viewer .hint{flex:none;padding:10px 14px 16px;font-size:11px;color:#39414C;
                text-align:center;letter-spacing:.05em;}


  /* ---- keypad, shared by the lock and the guess --------------------------- */
  .pad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;justify-content:center;
       padding:14px 0 4px;}
  .pad button{height:48px;border-radius:12px;border:1px solid #2A323D;background:#1B2029;
              color:var(--ink);font-family:inherit;font-size:18px;cursor:pointer;
              font-variant-numeric:tabular-nums;}
  .pad button:hover{background:#232B35;}
  .pad button:active{background:#2E3A45;}
  .pad button.wide{grid-column:span 2;font-size:14px;}
  .pad button.go{background:#2E3A45;border-color:#3A4551;}
  .pad button:focus-visible{outline:2px solid var(--instr);outline-offset:2px;}
  .padout{text-align:center;font-size:26px;letter-spacing:.32em;padding:8px 0 2px;
          color:var(--ink);font-variant-numeric:tabular-nums;min-height:34px;}
  .padmsg{text-align:center;font-size:12px;color:var(--faint);padding:4px 0 2px;min-height:18px;}
  .padmsg.bad{color:var(--alert);}
  .padmsg.good{color:#7FA087;}

  .locked{display:flex;flex-direction:column;justify-content:center;height:100%;
          padding:0 22px 40px;}
  .locked .glyph{text-align:center;font-size:34px;color:var(--faint);padding-bottom:4px;}
  .locked .cap{text-align:center;font-size:12px;color:var(--faint);letter-spacing:.06em;}

  .game{align-self:stretch;margin:6px 0 2px;padding:12px 10px 8px;border-radius:14px;
        background:#171C24;border:1px solid var(--line);}
  .game .head{font-size:12px;color:var(--dim);text-align:center;letter-spacing:.04em;}
  .game .tries{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding-top:8px;}
  .game .try{font-size:11px;color:var(--faint);border:1px solid var(--line);
             border-radius:9px;padding:2px 7px;font-variant-numeric:tabular-nums;}
  .game .try.up::after{content:" ↑";} .game .try.down::after{content:" ↓";}
  .game.done .pad{display:none;}
  .row .lock{color:var(--faint);font-size:12px;flex:none;}


  /* ---- voice memo --------------------------------------------------------- */
  .vm{display:flex;align-items:center;gap:10px;min-width:210px;padding:9px 12px 9px 10px;}
  .vm .play{flex:none;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
            background:#3A4551;color:#DDE3EA;font-size:13px;line-height:32px;padding:0;}
  .vm .play:hover{background:#46525F;}
  .vm .play:focus-visible{outline:2px solid var(--instr);outline-offset:2px;}
  .vm .wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;cursor:pointer;
            touch-action:none;}
  .vm .wave i{flex:1;background:#4C5765;border-radius:1px;min-width:2px;
              transition:background .08s;}
  body.reduce .vm .wave i{transition:none;}
  .vm .wave i.past{background:#93A2B2;}
  .vm .dur{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;
           min-width:30px;text-align:right;}

  /* ---- swipe to reveal the times ------------------------------------------ */
  .convo{transition:transform .18s cubic-bezier(.4,0,.2,1);}
  .convo.peeking{transition:none;}
  .convo{padding-left:12px;}
  .convo.shifted{padding-left:70px;}
  body.reduce .convo{transition:none;}
  .when{position:absolute;right:-58px;top:50%;transform:translateY(-50%);font-size:10px;
        user-select:none;-webkit-user-select:none;
        color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;
        opacity:0;transition:opacity .15s;}
  .convo.shifted .when{opacity:1;}
  body.reduce .when{transition:none;}

  /* ---- status bar --------------------------------------------------------- */
  .statusbar .right{display:flex;align-items:center;gap:7px;}
  .statusbar .bars{display:flex;align-items:flex-end;gap:2px;height:10px;}
  .statusbar .bars i{width:3px;background:#4A535E;border-radius:1px;}
  .statusbar .bars i.on{background:var(--dim);}
  .batt{display:flex;align-items:center;gap:3px;}
  .batt .cell{width:22px;height:11px;border:1px solid #4A535E;border-radius:3px;padding:1px;}
  .batt .fill{height:100%;background:var(--dim);border-radius:1px;}
  .batt.low .fill{background:var(--alert);}
  .batt .pct{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;}


  /* ---- search ------------------------------------------------------------- */
  .find{background:none;border:none;color:var(--dim);font-size:16px;line-height:1;
        padding:4px 6px;cursor:pointer;}
  .find:hover{color:var(--ink);}
  .searchbar{display:flex;align-items:center;gap:8px;width:100%;}
  .searchbar input{flex:1;min-width:0;background:#11151B;border:1px solid var(--line);
                   border-radius:16px;padding:7px 12px;color:var(--ink);font-family:inherit;
                   font-size:14px;}
  .searchbar input:focus{outline:none;border-color:#33414F;}
  .searchbar input::placeholder{color:var(--faint);}
  .hit{display:flex;flex-direction:column;gap:2px;padding:11px 14px;width:100%;
       border:none;border-bottom:1px solid var(--line);background:none;text-align:left;
       cursor:pointer;font-family:inherit;}
  .hit:hover{background:#171C23;}
  .hit .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .hit .who3{font-size:13px;font-weight:600;color:var(--ink);}
  .hit .at{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .hit .line{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
             white-space:nowrap;}
  .hit mark{background:none;color:var(--instr);}
  .empty{padding:26px 16px;text-align:center;font-size:12px;color:var(--faint);}

  /* ---- spot the difference ------------------------------------------------ */
  .spot{align-self:stretch;margin:6px 0 2px;padding:10px;border-radius:14px;
        background:#171C24;border:1px solid var(--line);}
  .spot .head{font-size:12px;color:var(--dim);text-align:center;padding-bottom:8px;}
  .spot .pair{display:flex;gap:8px;}
  .spot .shot{position:relative;flex:1;border-radius:8px;overflow:hidden;cursor:crosshair;
              line-height:0;}
  .spot canvas{width:100%;display:block;}
  .spot .tag{position:absolute;top:4px;left:5px;font-size:9px;color:#B9C2CC;
             background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px;line-height:1.4;}
  .spot .ring{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;
              border:2px solid var(--instr);border-radius:50%;pointer-events:none;
              opacity:0;transition:opacity .2s;}
  .spot.solved .ring{opacity:1;}
  body.reduce .spot .ring{transition:none;}
  .spot .miss{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
              border:1px solid #5A626D;pointer-events:none;}
  .spot .note2{text-align:center;font-size:11px;color:var(--faint);padding-top:8px;min-height:16px;}
  .spot.solved .note2{color:#7FA087;}


  /* ---- an unread row ------------------------------------------------------ */
  .row.new .rn{color:#F2F5F8;}
  .row.new .rp{color:#B6BEC8;font-weight:550;}
  .row.new .rtime{color:var(--alert);}

  /* ---- recall ------------------------------------------------------------- */
  .recall{align-self:stretch;margin:6px 0 2px;padding:12px;border-radius:14px;
          background:#171C24;border:1px solid var(--line);}
  .recall .head{font-size:12px;color:var(--dim);text-align:center;padding-bottom:10px;}
  .recall .opts{display:flex;flex-direction:column;gap:7px;}
  .recall .opt{width:100%;padding:10px 13px;border:1px solid #29313D;border-radius:12px;
               background:linear-gradient(180deg,#1A2029,#161B23);color:var(--ink);
               font-family:inherit;font-size:13.5px;text-align:left;cursor:pointer;
               box-shadow:var(--lift);
               transition:transform .12s var(--ease),border-color .15s,background .15s;}
  .recall .opt:hover{border-color:#3B4653;}
  .recall .opt:active{transform:scale(.985);}
  .recall .opt.right{border-color:var(--good);background:rgba(127,160,135,.10);}
  .recall .opt.wrong{border-color:#4A3034;opacity:.55;}
  .recall.done .opt{cursor:default;}
  .recall .note2{text-align:center;font-size:11px;color:var(--faint);
                 padding-top:10px;min-height:16px;}
  .recall.done .note2{color:var(--good);}


  /* ---- match -------------------------------------------------------------- */

    }
    /* Act II: a template that quotes the player back can only fire if the player
       actually said it. This is why Act I wrote memory from day one -- it cannot be
       retrofitted onto history someone has already lived through. */
    /* Act III: presence. A clue found in Act I is confirmed in Act III -- the light was
       on a sensor, and something was standing under it. A clue never found is never
       confirmed, and that silence is the cost of not having looked. */
    if (template.requiresClue && !context.clues[template.requiresClue]) return false;

    /* A template that reads the player's own words back cannot fire before they have
       typed enough of them. This is why the typing had to land first: it cannot be
       retrofitted onto a run somebody has already played. */
    if (template.requiresTyped) {
      var need = template.requiresTyped === true ? 1 : template.requiresTyped;
      var have = (context.typed || []).filter(function (t) {
        return t && typeof t.text === 'string' && t.text.trim().length > 1;
      });
      if (have.length < need) return false;
      var last = context.quotedOn;
      if (last !== undefined && context.day - last < QUOTE_COOLDOWN_DAYS) return false;
    }

    var tags = memoryTags(template);
    for (var j = 0; j < tags.length; j++) {
      if (!context.memory[tags[j]]) return false;
      /* Quoted once, then left alone for a fortnight. Saying it back twice in a week is
         nagging; coming back to it after two weeks is the thing having only that to say. */
      /* Combining two memories is not quoting one freshly: it is pointing out that both
         cannot be true. That works precisely because you already heard each of them, so
         the cooldown does not apply. */
      if (tags.length === 1) {
        var when = context.spent[tags[j]];
        if (when && (context.day - when) < RECALL_COOLDOWN_DAYS) return false;
      }
    }
    if (template.requiresMemory && context.recallUsed) return false;
    return true;
  }

  /* ---- planning ----------------------------------------------------------
     The ladder's reply budget is the primary driver, not the message count. Decay is
     "fewer people reply", so a phase keeps drawing templates until its budget is spent
     or the pool runs dry; the message target is a floor, not a cap. That makes
     replies-per-day an exact function of the ladder, which is what lets the gate assert
     the curve numerically instead of eyeballing it.
     -------------------------------------------------------------------------- */

  function totalBudget(budget) {
    var sum = 0;
    Object.keys(budget).forEach(function (k) { sum += budget[k]; });
    return sum;
  }

  function planPhase(content, options) {
    var castById = indexCast(content.cast);
    var rand = seededRandom([options.runSeed, options.day, options.phase]);
    var events = [];
    var used = {};
    var replies = 0;
    var dropped = 0;

    /* Rolled before the draw so it is part of the seed, not a side effect of it. */
    var recallAllowed = rand() < (options.recallChance === undefined ? 1 : options.recallChance);

    var pool = (content.templates.templates || []).filter(function (t) {
      return eligible(t, {
        act: options.act, phase: options.phase,
        fired: options.fired, flags: options.flags, day: options.day,
        memory: options.memory || {}, spent: options.spent || {},
        clues: options.clues || {}, typed: options.typed || [],
        quotedOn: options.quoted ? options.quoted.on : undefined, recallUsed: false
      });
    });

    /* The ladder decides how hard the draw leans toward being quoted back. */
    function weightOf(t) {
      var base = t.weight || 1;
      return t.requiresMemory ? base * (options.recallWeight || 1) : base;
    }

    var guard = 0;
    while (guard++ < 60) {
      if (events.length >= options.target && totalBudget(options.budget) <= 0) break;

      var available = pool.filter(function (t) { return !used[t.id]; });
      if (!available.length) break;

      /* Prefer templates whose speakers still have budget: a contact with nothing left
         to say should not be the one picked to say it. */
      var withBudget = available.filter(function (t) {
        return t.lines.some(function (l) { return (options.budget[l.speaker] || 0) > 0; });
      });
      /* Once nobody has budget the withBudget list is empty, and a no-reply sender like
         Notify would otherwise win the endgame by default. Prefer the cast who used to
         answer: the point of day 20 is a person talking to nobody. */
      /* Act I only. Its endgame wants a person talking to nobody, so it prefers the cast
         who used to answer. Applied later it silently excludes the unknown number, which
         is the one voice acts II and III are built on. */
      var human = options.act === 1
        ? available.filter(function (t) {
            return t.lines.some(function (l) {
              return castById[l.speaker] && (castById[l.speaker].baseReplies || 0) > 0;
            });
          })
        : available;
      var recall = recallAllowed
        ? available.filter(function (t) { return t.requiresMemory || t.requiresClue; })
        : [];
      var candidates = withBudget.length
        ? withBudget
        : (recall.length || human.length ? recall.concat(human) : available);
      var template = pickWeighted(rand, candidates, weightOf);
      if (!template) break;

      used[template.id] = true;
      if (template.once) options.fired[template.id] = true;
      if (template.requiresMemory) recallAllowed = false;   /* one per phase */
      if (template.requiresTyped && options.quoted) options.quoted.on = options.day;
      memoryTags(template).forEach(function (tag) { options.spent[tag] = options.day; });
      (template.setsFlags || []).forEach(function (f) { options.flags[f] = true; });

      var slots = chooseSlots(rand, template);
      memoryTags(template).forEach(function (tag, index) {
        slots[index === 0 ? 'MEMORY' : 'MEMORY' + (index + 1)] =
          (options.memory || {})[tag] || '';
      });
      var quoted = null;
      if (template.requiresTyped) {
        quoted = chooseTyped(rand, options.typed, template.threadId);
        if (quoted) {
          slots.TYPED = quoted.text;
          slots.TYPEDWHO = threadNameOf(content, quoted.threadId);
          slots.TYPEDDAY = String(quoted.day || 1);
        }
      }
      var openedBy = {};

      template.lines.forEach(function (line) {
        if (!castById[line.speaker]) return;

        /* The first line a contact says in a template opens; everything after it is a
           reply, and replies are what the ladder takes away. */
        var isReply = !!openedBy[line.speaker];
        /* A recall is not conversation, so it does not pay conversation's price. Decay
           is the cast losing the will to answer each other; the thing quoting you back
           has no such problem, and cutting it off mid-sentence loses the whole point of
           "ren stopped answering on the tuesday / you started on the sunday". */
        if (isReply && !template.requiresMemory && options.act === 1) {
          if ((options.budget[line.speaker] || 0) <= 0) { dropped++; return; }
          options.budget[line.speaker] -= 1;
          replies += 1;
        }
        openedBy[line.speaker] = true;

        events.push({
          templateId: template.id,
          threadId: template.threadId,
          speaker: line.speaker,
          from: 'them',
          kind: line.kind || 'text',
          game: line.game || null,
          asset: line.asset || null,
          durationMs: line.durationMs || null,
          body: fillSlots(line.text, slots),
          emphasis: line.emphasis || null,
          quotesPlayer: !!(quoted && /\{TYPED\}/.test(line.text)),
          isReply: isReply
        });
      });

      (template.choices || []).forEach(function (choice) {
        events.push({
          templateId: template.id,
          threadId: template.threadId,
          kind: 'choice',
          choiceId: choice.id,
          label: choice.label,
          match: choice.match || null,
          silent: !!choice.silent,
          tells: choice.tells ? fillSlots(choice.tells, slots) : null,
          revealsClue: choice.revealsClue || null,
          memory: choice.memory
            ? { tag: choice.memory.tag, fragment: fillSlots(choice.memory.fragment, slots) }
            : null
        });
      });
    }

    /* D26: the player can always reply. Decay is something that happens to other
       people, and a phase with nothing to say is a phase where this stopped being a
       messaging app. If the draw produced no choices, draw one that has them -- ignoring
       budget, because the budget governs the cast, never the player. */
    if (!events.some(function (e) { return e.kind === 'choice'; })) {
      var withChoices = pool.filter(function (t) {
        return !used[t.id] && (t.choices || []).length;
      });
      var rescue = pickWeighted(rand, withChoices, weightOf);
      if (rescue) {
        used[rescue.id] = true;
        if (rescue.once) options.fired[rescue.id] = true;
        (rescue.setsFlags || []).forEach(function (f) { options.flags[f] = true; });
        var rescueSlots = chooseSlots(rand, rescue);
        memoryTags(rescue).forEach(function (tag, index) {
          rescueSlots[index === 0 ? 'MEMORY' : 'MEMORY' + (index + 1)] =
            (options.memory || {})[tag] || '';
        });
        var rescueOpened = {};
        rescue.lines.forEach(function (line) {
          if (!castById[line.speaker]) return;
          if (rescueOpened[line.speaker]) return;   /* the opener only: no budget spent */
          rescueOpened[line.speaker] = true;
          events.push({
            templateId: rescue.id,
            threadId: rescue.threadId,
            speaker: line.speaker,
            from: 'them',
            kind: 'text',
            body: fillSlots(line.text, rescueSlots),
            isReply: false
          });
        });
        (rescue.choices || []).forEach(function (choice) {
          events.push({
            templateId: rescue.id,
            threadId: rescue.threadId,
            kind: 'choice',
            choiceId: choice.id,
            label: choice.label,
            match: choice.match || null,
            silent: !!choice.silent,
            tells: choice.tells ? fillSlots(choice.tells, rescueSlots) : null,
            revealsClue: choice.revealsClue || null,
            memory: choice.memory
              ? { tag: choice.memory.tag,
                  fragment: fillSlots(choice.memory.fragment, rescueSlots) }
              : null
          });
        });
      }
    }

    return { events: events, replies: replies, dropped: dropped };
  }

  /* Day 1 is authored: its morning is beat 1's history and its night is the live beats
     that already exist in story.json. It enters the system as the first entry, not as an
     exception to it. */
  function authoredDay(content, day, entry) {
    var story = content.story || { beats: [] };
    var live = [], history = [];
    (story.beats || []).forEach(function (beat) {
      var isLive = beat.messages.some(function (m) { return m.live === true; });
      (isLive ? live : history).push(beat);
    });

    function eventsFrom(beats) {
      var out = [];
      beats.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; }).forEach(function (beat) {
        var opened = {};
        beat.messages.forEach(function (m) {
          if (m.from !== 'them') return;
          var who = m.fromContactId || beat.threadId;
          var isReply = !!opened[who];
          opened[who] = true;
          out.push({
            templateId: 'authored',
            threadId: beat.threadId,
            speaker: m.fromContactId || null,
            from: 'them',
            kind: m.kind,
            body: m.body || '',
            isReply: isReply
          });
        });
      });
      return out;
    }

    var dayEvents = eventsFrom(history);
    var nightEvents = eventsFrom(live);
    var replies = function (list) {
      return list.filter(function (e) { return e.isReply; }).length;
    };
    return {
      day: day,
      act: entry.act,
      authored: true,
      phases: { day: dayEvents, night: nightEvents },
      replies: replies(dayEvents) + replies(nightEvents),
      dropped: 0,
      messages: dayEvents.length + nightEvents.length,
      budgetAtStart: {},
      budgetLeft: {}
    };
  }

  function planDay(content, runSeed, day, carried) {
    var entry = ladderFor(content.ladder, day);
    if (!entry) return null;
    if (entry.authored) return authoredDay(content, day, entry);

    var castById = indexCast(content.cast);
    var state = carried || { flags: {}, fired: {}, memory: {}, spent: {}, clues: {} };
    state.memory = state.memory || {};
    state.spent = state.spent || {};
    state.clues = state.clues || {};
    state.typed = state.typed || [];
    state.quoted = state.quoted || {};

    /* Split the day's budget between the phases so night is never left mute by a
       talkative morning. */
    var dayBudget = {}, nightBudget = {};
    Object.keys(castById).forEach(function (id) {
      var whole = Math.max(0, Math.round((castById[id].baseReplies || 0) * entry.replyBudget));
      dayBudget[id] = Math.ceil(whole * 0.6);
      nightBudget[id] = whole - dayBudget[id];
    });

    var out = {
      day: day,
      act: entry.act,
      authored: false,
      budgetAtStart: {
        day: JSON.parse(JSON.stringify(dayBudget)),
        night: JSON.parse(JSON.stringify(nightBudget))
      },
      phases: {},
      replies: 0,
      dropped: 0,
      messages: 0
    };

    [['day', dayBudget], ['night', nightBudget]].forEach(function (pair) {
      var result = planPhase(content, {
        runSeed: runSeed,
        day: day,
        phase: pair[0],
        act: entry.act,
        target: pair[0] === 'day' ? entry.dayMessages : entry.nightMessages,
        budget: pair[1],
        flags: state.flags,
        fired: state.fired,
        memory: state.memory,
        spent: state.spent,
        clues: state.clues,
        typed: state.typed,
        quoted: state.quoted,
        recallWeight: entry.recallWeight || 1,
        recallChance: entry.recallChance === undefined ? 1 : entry.recallChance
      });
      out.phases[pair[0]] = result.events;
      out.replies += result.replies;
      out.dropped += result.dropped;
      out.messages += result.events.filter(function (e) { return e.kind !== 'choice'; }).length;
    });

    out.budgetLeft = { day: dayBudget, night: nightBudget };
    return out;
  }

  /* Determinism is now conditional: same seed AND same memory produces the same
     transcript. Act II reads what the player said, so the seed alone cannot describe a
     run any more. Tests pass a fixed memory to keep the property testable. */
  function planRun(content, runSeed, fromDay, toDay, memory) {
    /* copy: a run accumulates memory forward, and mutating the caller's object would
       make the second identical call start from the first one's leftovers. */
    var seeded = {};
    Object.keys(memory || {}).forEach(function (k) { seeded[k] = memory[k]; });
    var state = { flags: {}, fired: {}, memory: seeded, spent: {}, clues: {} };
    var days = [];
    for (var day = fromDay; day <= toDay; day++) {
      var planned = planDay(content, runSeed, day, state);
      if (planned) {
        days.push(planned);
        /* a run remembers forward: what was said on day 3 is still quotable on day 30 */
        ['day', 'night'].forEach(function (phase) {
          (planned.phases[phase] || []).forEach(function (e) {
            if (e.kind !== 'choice') return;
            if (e.memory && !state.memory[e.memory.tag]) {
              state.memory[e.memory.tag] = e.memory.fragment;
            }
            if (e.revealsClue) state.clues[e.revealsClue] = true;
          });
        });
      }
    }
    return days;
  }


  /* ---- what the player typed --------------------------------------------
     The player types freely; this decides which authored reply they meant. It is
     deliberately dumb and deliberately explainable: a scoring pass over keywords
     that a human wrote down next to each choice. Nothing here generates a line.

     Negations are never stopwords. "i did" and "i didnt" are the same sentence
     minus three letters, and getting that wrong is the difference between
     confessing and denying. */

  var STOPWORDS = {
    the: 1, a: 1, an: 1, and: 1, or: 1, but: 1, of: 1, to: 1, in: 1, on: 1, at: 1,
    is: 1, are: 1, was: 1, were: 1, be: 1, been: 1, am: 1, im: 1, ive: 1, ill: 1,
    it: 1, its: 1, this: 1, that: 1, there: 1, here: 1, then: 1, so: 1, just: 1,
    for: 1, with: 1, my: 1, your: 1, we: 1, they: 1, them: 1, i: 1, me: 1
  };

  var NEGATIONS = {
    no: 1, not: 1, nope: 1, dont: 1, didnt: 1, doesnt: 1, wasnt: 1, isnt: 1,
    wont: 1, cant: 1, never: 1, nothing: 1, nobody: 1, none: 1, neither: 1
  };

  /* Yes and no arrive in two dozen spellings and nobody should have to write them all
     out next to every choice. Only these two families are folded -- anything wider and
     the matcher starts deciding what the player meant instead of reading it. */
  var CANON = (function () {
    var map = {};
    var families = [
      ['yes', 'yeah yep yea aye yup sure ok okay fine course certainly definitely absolutely'],
      ['no',  'nope nah naw negative']
    ];
    for (var i = 0; i < families.length; i++) {
      var head = families[i][0], words = families[i][1].split(' ');
      map[head] = head;
      for (var j = 0; j < words.length; j++) map[words[j]] = head;
    }
    return map;
  })();

  function canon(word) { return CANON[word] || word; }

  /* Apostrophes go rather than split: didn't and didnt must be the same word, because
     half the people typing will not reach for the apostrophe on a phone. */
  function normalise(text) {
    return String(text == null ? '' : text)
      .toLowerCase()
      .replace(/['’`]/g, '')
      .replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function tokenise(text) {
    var out = [], raw = normalise(text).split(' ');
    for (var i = 0; i < raw.length; i++) {
      var w = raw[i];
      if (!w) continue;
      if (STOPWORDS[w] && !NEGATIONS[w]) continue;
      out.push(canon(w));
    }
    return out;
  }

  function hasNegation(tokens) {
    for (var i = 0; i < tokens.length; i++) if (NEGATIONS[tokens[i]]) return true;
    return false;
  }

  var PHRASE_HIT = 5;    /* they typed the whole authored phrase */
  var TERM_HIT   = 3;    /* they typed a word someone wrote down for this choice */
  var LABEL_HIT  = 1;    /* they typed a word off the button itself */
  var NEG_MISS   = 4;    /* they negated and this choice does not, or the reverse */
  var MIN_SCORE  = 3;    /* below this, nobody understood them */

  function scoreChoice(input, tokens, choice) {
    var terms = choice.match || [], score = 0, i, j, seen = {};

    for (i = 0; i < terms.length; i++) {
      var term = normalise(terms[i]);
      if (!term) continue;
      if (term.indexOf(' ') >= 0) {
        if (input.indexOf(term) >= 0) score += PHRASE_HIT;
        continue;
      }
      var want = canon(term);
      for (j = 0; j < tokens.length; j++) {
        if (tokens[j] === want && !seen['t' + want]) { seen['t' + want] = 1; score += TERM_HIT; }
      }
    }

    var label = tokenise(choice.label || '');
    for (i = 0; i < label.length; i++) {
      for (j = 0; j < tokens.length; j++) {
        if (tokens[j] === label[i] && !seen['l' + label[i]]) {
          seen['l' + label[i]] = 1; score += LABEL_HIT;
        }
      }
    }

    /* "i did" and "i didnt" score identically on overlap alone. They are opposites. */
    if (score > 0) {
      var mine = hasNegation(tokens);
      var theirs = hasNegation(label.concat(terms.join(' ').split(' ')));
      if (mine !== theirs) score -= NEG_MISS;
    }
    return score;
  }

  /* Returns the choice they meant, or null if nobody could tell. Deterministic: a tie
     goes to the earlier choice, because a coin flip reads to the player as a bug. */
  function matchReply(text, choices) {
    var input = normalise(text);
    if (!input) return null;
    /* "that was me" is three stopwords and nothing else, and it is a real reply someone
       wrote. Bailing on an empty token list threw away every phrase-only match. */
    var tokens = tokenise(text);

    var best = null, bestScore = 0, runnerUp = 0;
    for (var i = 0; i < (choices || []).length; i++) {
      var choice = choices[i];
      if (!choice || choice.silent) continue;
      var score = scoreChoice(input, tokens, choice);
      if (score > bestScore) { runnerUp = bestScore; bestScore = score; best = choice; }
      else if (score > runnerUp) { runnerUp = score; }
    }
    if (!best || bestScore < MIN_SCORE) return null;
    return { choice: best, score: bestScore, runnerUp: runnerUp };
  }

  /* Two choices in the same breath that answer to the same words are a coin flip. The
     validator uses this; it is here so there is one definition of "ambiguous". */
  function collisions(choices) {
    var out = [], i, j;
    for (i = 0; i < choices.length; i++) {
      for (j = i + 1; j < choices.length; j++) {
        if (choices[i].silent || choices[j].silent) continue;
        var a = (choices[i].match || []).map(normalise);
        var b = (choices[j].match || []).map(normalise);
        var shared = a.filter(function (term) { return term && b.indexOf(term) >= 0; });
        if (shared.length) {
          out.push({ a: choices[i].id, b: choices[j].id, shared: shared });
        }
      }
    }
    return out;
  }

  return {
    xmur3: xmur3,
    mulberry32: mulberry32,
    seededRandom: seededRandom,
    fillSlots: fillSlots,
    chooseTyped: chooseTyped,
    threadNameOf: threadNameOf,
    normalise: normalise,
    tokenise: tokenise,
    matchReply: matchReply,
    collisions: collisions,
    ladderFor: ladderFor,
    actFor: actFor,
    planPhase: planPhase,
    planDay: planDay,
    planRun: planRun
  };
});

</script>

<script>
(function(){
"use strict";

/* ============================================================================
   D19 — SINGLE INGRESS
   Exactly one function puts story text on screen. It accepts only tokens minted
   by the Story or Director modules, and it stamps what it touched. Anything that
   reaches a bubble by another route has no stamp, and auditIngress() finds it.
   ========================================================================== */
var Text = (function(){
  var MINT = {};                       /* private brand; unreachable from outside */
  function mint(origin, value){
    return { __brand: MINT, origin: origin, value: value == null ? "" : String(value) };
  }
  function isToken(t){ return !!t && t.__brand === MINT; }
  function paint(el, token){
    if(!isToken(token)){
      /* not-story: developer-facing */
      throw new Error("story text must be a minted token (D19)");
    }
    el.textContent = token.value;
    el.setAttribute("data-src", token.origin);
    return el;
  }
  return { mint: mint, isToken: isToken, paint: paint };
})();

/* The player is now an author, so the player gets a minter. Their words are the one
   thing on screen that is not in any content file, and `data-src="player.typed"` is how
   the audit says so. */
var Player = {
  said: function(text){ return Text.mint("player.typed", String(text == null ? "" : text)); }
};

/* ============================================================================
   STORY LAYER — knows the schema, touches no DOM (D18)
   ========================================================================== */
var Story = (function(data){
  var beatsById = {}, contactsById = {}, threadsById = {};
  (data.beats || []).forEach(function(b){ beatsById[b.id] = b; });
  (data.contacts || []).forEach(function(c){ contactsById[c.id] = c; });
  (data.threads || []).forEach(function(t){ threadsById[t.id] = t; });

  return {
    raw: data,
    threads: function(){ return data.threads || []; },
    thread: function(id){ return threadsById[id]; },
    beat: function(id){ return beatsById[id]; },
    contact: function(id){ return contactsById[id]; },
    contactName: function(id){
      var c = contactsById[id];
      return c ? Text.mint("story.contact", c.displayName) : null;
    },
    threadName: function(t){ return Text.mint("story.thread", t.displayName); },
    bodyOf: function(m){ return Text.mint("story.message", m.body || ""); },
    labelOf: function(c){ return Text.mint("story.choice", c.label); },
    endingTitle: function(e){ return Text.mint("story.ending", e.title); },
    endingBody: function(e){ return Text.mint("story.ending", e.body); },
    endingFor: function(flags){
      var list = data.endings || [], found = null;
      list.forEach(function(e){
        if(found) return;
        var need = e.requiresFlags || [];
        if(!need.length) return;
        for(var i=0;i<need.length;i++){ if(!flags[need[i]]) return; }
        found = e;
      });
      return found;
    },
    messagesOf: function(beatId, flags){
      var b = beatsById[beatId];
      if(!b) return [];
      return (b.messages || []).filter(function(m){
        var need = m.requiresFlags || [];
        for(var i=0;i<need.length;i++){ if(!flags[need[i]]) return false; }
        return true;
      });
    },
    choicesOf: function(beatId){
      var b = beatsById[beatId];
      return (b && b.choices) || [];
    },
    nextOf: function(beatId){
      var b = beatsById[beatId];

/* ============================================================================
   CLOCK
   ========================================================================== */
var LAUNCH = new Date();
var WEEKDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var WEEKDAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function at(offsetMin){ return new Date(LAUNCH.getTime() + offsetMin*60000); }
function dayKey(d){ return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function hhmm(d){ var h=d.getHours(), m=d.getMinutes(); return h+":"+(m<10?"0"+m:m); }
function daysBack(d){
  return Math.round((new Date(dayKey(LAUNCH)) - new Date(dayKey(d)))/86400000);
}
function dayLabel(d){
  var n = daysBack(d);
  if(n===0) return "Today";
  if(n===1) return "Yesterday";
  if(n<7) return WEEKDAY[d.getDay()];
  return d.getDate()+"/"+(d.getMonth()+1);
}
function listStamp(offsetMin){
  var d = at(offsetMin), n = daysBack(d);
  if(n===0) return hhmm(d);
  if(n===1) return "Yesterday";
  if(n<7) return WEEKDAY_SHORT[d.getDay()];
  return d.getDate()+"/"+(d.getMonth()+1);
}
function stampLabel(offsetMin){
  return offsetMin === 0 ? "now" : hhmm(at(offsetMin));
}

/* ============================================================================
   D24 — PERSISTENCE AND ELAPSED TIME
   ========================================================================== */
var STORAGE_KEY = "unread.save.v1";
var MINUTE = 60000, HOUR = 60*MINUTE;
var BANDS = {
  RESUME:   2*MINUTE,      /* < 2m  : nothing changed          */
  ADVANCED: HOUR,          /* < 1h  : messages already waiting */
  MISSED:   12*HOUR        /* < 12h : phase closed, no replies */
};

/* Local calendar day, not UTC: the streak has to agree with the player's own night. */
function dayStamp(now){
  var d = new Date(now);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function daysBetweenStamps(a, b){
  function toUTC(stamp){
    var p = String(stamp).split("-");
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  }
  return Math.round((toUTC(b) - toUTC(a)) / 86400000);
}

/* Consecutive real-world days with the app opened. Pure so the gate can walk a year of
   it without a clock: hand it a save and a stamp, get the save's new streak back. */
function rollStreak(save, stamp){
  var last = save.streakStamp;
  if(!last){ save.streak = 1; }
  else {
    var gap = daysBetweenStamps(last, stamp);
    if(gap === 0) return save.streak || 1;
    save.streak = gap === 1 ? (save.streak || 0) + 1 : 1;
  }
  save.streakBest = Math.max(save.streakBest || 0, save.streak);
  save.streakStamp = stamp;
  return save.streak;
}

function randomSeed(){
  try {
    var buf = new Uint32Array(2);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    return buf[0].toString(36) + buf[1].toString(36);
  } catch(e){
    return String(new Date().getTime());
  }
}

var Save = {
  read: function(){
    try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "null"); }
    catch(e){ return null; }
  },
  write: function(state){
    if(Save.wiped) return;
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* private mode: the run simply does not persist */ }
  },
  wiped: false,
  clear: function(){
    /* Latch it. Otherwise touch() on beforeunload writes the in-memory save straight
       back over the top and the reset does nothing at all. */
    Save.wiped = true;
    try { window.localStorage.removeItem(STORAGE_KEY); } catch(e){}
  },
  fresh: function(now){
    return {
      runSeed: randomSeed(),
      day: 1,
      phase: "day",
      phaseStartedAt: now,
      lastSeenAt: now,
      flags: {},
      contactState: {},
      cluesFound: {},
      seen: {},
      streak: 0,
      streakBest: 0,
      streakStamp: null,
      opens: 0
    };
  }
};

/* The whole of D24 in one pure function, so the gate can assert it without a browser
   clock: given a save and a wall-clock now, what changed while you were gone? */
function applyAway(save, now){
  var awayMs = Math.max(0, now - (save.lastSeenAt || now));
  var result = { awayMs: awayMs, band: "resume", daysAdvanced: 0,
                 waiting: 0, repliesLocked: false };

  if(awayMs < BANDS.RESUME){
    result.band = "resume";
  } else if(awayMs < BANDS.ADVANCED){
    result.band = "advanced";
    /* 1-3 messages arrived while you were gone, scaled by how long that was */
    result.waiting = Math.min(3, 1 + Math.floor(awayMs / (20*MINUTE)));
  } else if(awayMs < BANDS.MISSED){
    result.band = "missed";
    result.repliesLocked = true;
  } else {
    result.band = "dayAdvanced";
    result.daysAdvanced = Math.min(3, Math.floor(awayMs / (12*HOUR)));
    result.repliesLocked = true;
  }
  return result;
}

/* ============================================================================
