  streakOne:     "1 day",
  streakMany:    "{N} days",
  longest:       "Longest",
  opens:         "Times opened"
};
/* not-story:end */

var PREF_KEY = "unread.prefs.v1";
var prefsWiped = false;
var Prefs = {
  defaults: { sound: true, alerts: true, vibrate: false, text: "M", motion: false,
              stamps: true, blocked: [] },
  read: function(){
    var stored = {};
    try { stored = JSON.parse(window.localStorage.getItem(PREF_KEY) || "{}") || {}; }
    catch(e){ stored = {}; }
    var out = {};
    Object.keys(this.defaults).forEach(function(k){
      out[k] = stored[k] === undefined ? Prefs.defaults[k] : stored[k];
    });
    return out;
  },
  write: function(p){
    if(prefsWiped) return;
    try { window.localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch(e){}
  }
};

var TEXT_PX = { S: "13px", M: "15px", L: "17px" };
var prefs = Prefs.read();

function applyPrefs(){
  document.documentElement.style.setProperty("--text", TEXT_PX[prefs.text] || TEXT_PX.M);
  document.body.classList.toggle("reduce", !!prefs.motion);
  document.body.classList.toggle("notimestamps", !prefs.stamps);
}

function savePrefs(){ Prefs.write(prefs); applyPrefs(); }

/* live values, read at the moment the sheet opens rather than cached */
function messageCount(){
  var n = 0;
  Object.keys(S.shown).forEach(function(id){ n += S.shown[id].length; });
  return n;
}
function storageBytes(){
  var total = 0;
  try {
    for(var i=0;i<window.localStorage.length;i++){
      var key = window.localStorage.key(i);
      total += key.length + (window.localStorage.getItem(key) || "").length;
    }
  } catch(e){}
  /* the fiction is a phone that has been carrying these threads for months */
  return total * 2 + messageCount() * 1400;
}
function humanBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(0) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

/* Ren's account, and the last time Ren used it. On day one that reads six days. On day
   one hundred it reads a hundred and five, while you are holding the phone. */
function renLastActive(){
  var newest = null;
  Story.threads().forEach(function(t){
    (S.shown[t.id] || []).forEach(function(m){
      if(m.from !== "me") return;
      if(newest === null || m.offsetMinutes > newest) newest = m.offsetMinutes;
    });
  });
  if(newest === null) return CHROME.now;
  var elapsed = Math.max(0, -newest) + ((S.save && S.save.day ? S.save.day - 1 : 0) * 1440);
  var days = Math.floor(elapsed / 1440);
  if(days < 1) return CHROME.now;
  return days + (days === 1 ? " day ago" : " days ago");   /* not-story */
}

/* ---- builders: every string goes through the one ingress (D19) ------------ */
function chrome(text){ return Text.mint("ui.chrome", text); }

function streakLabel(n){
  n = n || 1;
  return n === 1 ? CHROME.streakOne : CHROME.streakMany.replace("{N}", String(n));
}

function sGroup(label){
  var el = document.createElement("div");
  el.className = "sgroup";
  Text.paint(el, chrome(label));
  return el;
}

function sRow(label, sub){
  var row = document.createElement("div");
  row.className = "srow";
  var wrap = document.createElement("span");
  wrap.className = "lbl";
  var main = document.createElement("span");
  Text.paint(main, chrome(label));
  wrap.appendChild(main);
  if(sub){
    var s2 = document.createElement("span");
    s2.className = "sub";
    Text.paint(s2, chrome(sub));
    wrap.appendChild(s2);
  }
  row.appendChild(wrap);
  return row;
}

function sToggle(label, sub, key, onChange){
  var row = sRow(label, sub);
  var b = document.createElement("button");
  b.className = "toggle";
  b.setAttribute("role", "switch");
  b.setAttribute("data-pref", key);
  b.setAttribute("aria-checked", prefs[key] ? "true" : "false");
  b.setAttribute("aria-label", label);
  b.addEventListener("click", function(){
    prefs[key] = !prefs[key];
    b.setAttribute("aria-checked", prefs[key] ? "true" : "false");
    savePrefs();
    if(onChange) onChange(prefs[key]);
  });
  row.appendChild(b);
  return row;
}

function sValue(label, value){
  var row = sRow(label);
  var v = document.createElement("span");
  v.className = "val";
  Text.paint(v, chrome(value));
  row.appendChild(v);
  return row;
}

function sSegment(label, key, options){
  var row = sRow(label);
  var seg = document.createElement("div");
  seg.className = "seg";
  options.forEach(function(option){
    var b = document.createElement("button");
    b.setAttribute("data-size", option);
    b.setAttribute("aria-pressed", prefs[key] === option ? "true" : "false");
    Text.paint(b, chrome(CHROME[option === "S" ? "small" : option === "M" ? "medium" : "large"]));
    b.addEventListener("click", function(){
      prefs[key] = option;
      savePrefs();
      Array.prototype.forEach.call(seg.children, function(c){
        c.setAttribute("aria-pressed", c.getAttribute("data-size") === option ? "true" : "false");
      });
    });
    seg.appendChild(b);
  });
  row.appendChild(seg);
  return row;
}

function sButton(label, sub, onClick, danger){
  var row = document.createElement("button");
  row.className = "srow" + (danger ? " danger" : "");
  var wrap = document.createElement("span");
  wrap.className = "lbl";
  var main = document.createElement("span");
  Text.paint(main, chrome(label));
  wrap.appendChild(main);
  if(sub){
    var s2 = document.createElement("span");
    s2.className = "sub";
    Text.paint(s2, chrome(sub));
    wrap.appendChild(s2);
  }
  row.appendChild(wrap);
  row.addEventListener("click", onClick);
  return row;
}

function buildSettings(){
  var body = document.getElementById("sheetBody");
  body.innerHTML = "";

  var card = document.createElement("div");
  card.className = "me-card";
  var av = document.createElement("span");
  av.className = "avatar";
  av.style.background = "#7E8A93";
  av.textContent = "R";              /* not-story: the account initial */
  var col = document.createElement("span");
  col.className = "col";
  var name = document.createElement("span");
  name.className = "who2";
  Text.paint(name, chrome(CHROME.account));
  var sub = document.createElement("span");
  sub.className = "sub";
  Text.paint(sub, chrome(CHROME.lastActive + " " + renLastActive()));
  col.appendChild(name); col.appendChild(sub);
  card.appendChild(av); card.appendChild(col);
  body.appendChild(card);

  body.appendChild(sGroup(CHROME.activity));
  body.appendChild(sValue(CHROME.streak, streakLabel(S.save && S.save.streak)));
  body.appendChild(sValue(CHROME.longest, streakLabel(S.save && S.save.streakBest)));
  body.appendChild(sValue(CHROME.opens, String((S.save && S.save.opens) || 1)));

  body.appendChild(sGroup(CHROME.notifications));
  body.appendChild(sToggle(CHROME.sound, CHROME.soundSub, "sound", function(on){
    if(on) Sound.play("receive");   /* hear what you just turned on */
  }));
  body.appendChild(sToggle(CHROME.alerts, CHROME.alertsSub, "alerts"));
  body.appendChild(sToggle(CHROME.vibrate, CHROME.vibrateSub, "vibrate", function(on){
    if(on && navigator.vibrate) navigator.vibrate(18);
  }));

  body.appendChild(sGroup(CHROME.display));
  body.appendChild(sSegment(CHROME.textSize, "text", ["S", "M", "L"]));
  body.appendChild(sToggle(CHROME.reduceMotion, null, "motion"));
  body.appendChild(sToggle(CHROME.timestamps, null, "stamps"));

  body.appendChild(sGroup(CHROME.privacy));
  var blockedRow = sValue(CHROME.blocked,
    prefs.blocked.length ? String(prefs.blocked.length) : CHROME.blockedNone);
  body.appendChild(blockedRow);
  var fail = document.createElement("div");
  fail.className = "fail";
  fail.style.display = "none";
  body.appendChild(sButton(CHROME.blockThis, null, function(){
    /* It never works. The number is not in the phone's contact list, so there is nothing
       for the block to attach to -- which the app can only express as a failure. */
    Text.paint(fail, chrome(CHROME.blockFailed));
    fail.style.display = "";
  }));
  body.appendChild(fail);

  body.appendChild(sGroup(CHROME.storage));
  body.appendChild(sValue(CHROME.messages, String(messageCount())));
  body.appendChild(sValue(CHROME.onDevice, humanBytes(storageBytes())));

  body.appendChild(sGroup(CHROME.about));
  body.appendChild(sValue(CHROME.version, CHROME.versionNo));
  body.appendChild(sButton(CHROME.reset, CHROME.resetSub, function(){
    if(this.getAttribute("data-armed") === "1"){
      Save.clear();
      try { window.localStorage.removeItem(PREF_KEY); } catch(e){}
      prefsWiped = true;
      window.location.reload();
      return;
    }
    this.setAttribute("data-armed", "1");
    Text.paint(this.querySelector(".lbl > span"), chrome(CHROME.resetConfirm));
  }, true));

  var note = document.createElement("div");
  note.className = "note";
  Text.paint(note, chrome(CHROME.fiction));
  body.appendChild(note);
}

function openSettings(){
  document.querySelector(".phone").scrollTop = 0;
  buildSettings();
  Text.paint(document.getElementById("sheetTitle"), chrome(CHROME.settings));
  var sheet = document.getElementById("sheet");
  sheet.classList.add("on");
  sheet.setAttribute("aria-hidden", "false");
}
function closeSettings(){
  var sheet = document.getElementById("sheet");
  sheet.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
}
document.getElementById("sheetBack").addEventListener("click", closeSettings);
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSettings();
});
applyPrefs();

/* ============================================================================
   BOOT
   ========================================================================== */
/* A phone laying the page out at 980px shows a doll's house. If whatever is hosting
   this did not put a viewport in the head, put one there. */
function ensureViewport(){
  if(document.querySelector('head meta[name="viewport"]')) return;
  var m = document.createElement("meta");
  m.setAttribute("name", "viewport");
  m.setAttribute("content", "width=device-width,initial-scale=1,viewport-fit=cover");
  document.head.appendChild(m);
}

function boot(){
  ensureViewport();
  var now = new Date().getTime();
  var save = Save.read();
  if(!save){ save = Save.fresh(now); }
  S.save = save;
  S.flags = save.flags || {};

  S.away = applyAway(save, now);
  if(S.away.band === "missed" || S.away.band === "dayAdvanced"){
    S.repliesLocked = true;
    S.pendingChoices = [];
  }
  if(S.away.daysAdvanced > 0){
    save.day = Math.min(100, (save.day || 1) + S.away.daysAdvanced);
    save.phase = "day";
  }
  save.lastSeenAt = now;
  rollStreak(save, dayStamp(now));
  save.opens = (save.opens || 0) + 1;
  Save.write(save);

  if(save.day > 1) loadPhase(save.day, save.phase, { silent: true });
  renderList();
}

function touch(){
  if(!S.save) return;
  S.save.lastSeenAt = new Date().getTime();
  Save.write(S.save);
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden && S.beat>=3 && !S.ended) S.leftDuringLive=true;
  touch();
});
window.addEventListener("pagehide", touch);
window.addEventListener("beforeunload", touch);

/* ============================================================================
   TEST HOOKS
   ========================================================================== */
window.__unread = {
  state: S,
  story: Story,
  save: Save,
  applyAway: applyAway,
  bands: BANDS,
  phaseWindowMs: PHASE_WINDOW_MS,
  openThread: openThread,
  renderList: function(){ return renderList(true); },
  loadPhase: function(day, phase){ return loadPhase(day, phase); },
  toList: function(){ return renderList(true); },
  say: function(text){ return sendTyped(text); },
  typed: function(){ return typedBank().slice(); },
  matchIn: function(threadId, text){
    var mine = (S.liveChoices || []).filter(function(c){ return !c.silent; });
    var hit = Director.matchReply(text, mine.map(function(c){
      return { id: c.id, label: c.label, match: c.match, silent: c.silent };
    }));
    return hit ? { id: hit.choice.id, score: hit.score } : null;
  },
  renderListSoft: function(){ return renderList(); },
  choicesForThread: function(id){ return choicesForThread(id).map(function(c){ return c.id; }); },
  finalDay: FINAL_DAY,
  openSettings: openSettings,
  closeSettings: closeSettings,
  prefs: function(){ return prefs; },
  sound: Sound,
  viewer: viewer,
  reactions: function(){ return reactionsBank(); },
  favouriteReaction: favouriteReaction,
  react: function(id, emoji){ setReaction(id, emoji); },
  secretFor: secretFor,
  isLocked: function(id){ return isLocked(Story.thread(id)); },
  games: function(){ return (S.save && S.save.games) || {}; },
  memo: Memo,
  drawStatusBar: drawStatusBar,
  unreadCount: function(id){ return unreadCount(Story.thread(id)); },
  rollStreak: rollStreak,
  dayStamp: dayStamp,
  streak: function(){ return (S.save && S.save.streak) || 0; },
  openSearch: openSearch,
  search: function(q){ openSearch(); return runSearch(q); },
  spotTarget: SPOT_TARGET,
  recallOptions: recallOptions,
  matchFaces: function(){ return MATCH_FACES.slice(); },
  fragments: allFragments,
  haptics: Haptics,
  memory: function(){ return (S.save.contactState && S.save.contactState.memory) || {}; },
  pendingInThread: function(id){
    return pendingInThread(id).map(function(c){ return { id: c.id, templateId: c.templateId }; });
  },
  pickChoice: function(id){
    var el = document.querySelector('[data-choice="' + id + '"]');
    if(el) el.click();
    return !!el;
  },
  /* D19: every element that shows story text carries the ingress stamp. Anything that
     reached the screen another way has none, and shows up here. */
  auditIngress: function(){
    var offenders = [];
    /* not-story: a CSS selector */
    var nodes = document.querySelectorAll(".msg, .choice, .rp, .rn, .photo");
    Array.prototype.forEach.call(nodes, function(el){
      if(!el.getAttribute("data-src")) offenders.push(el.className + ":" + el.textContent.slice(0,40));
    });
    return offenders;
  },
  paintUnminted: function(){
    /* the seeded negative: a second path into a bubble */
    var wrap = scroll.querySelector(".convo") || scroll;
    var rogue = document.createElement("div");
    rogue.className = "msg them";
    /* not-story: the seeded negative deliberately bypasses the ingress */
    rogue.textContent = "this did not come from story.json";
    wrap.appendChild(rogue);
    return rogue;
  },
  mintedPaintRejects: function(){
    var el = document.createElement("div");
    try { Text.paint(el, "a raw string"); return false; }
    catch(e){ return true; }
  }
};

boot();
})();
